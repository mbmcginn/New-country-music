<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Country Music Finder</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #121212;
  color: white;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 720px;
  margin: auto;
}

h1 {
  text-align: center;
  margin-top: 25px;
}

.subtitle {
  text-align: center;
  color: #b3b3b3;
}

.filters {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}

.filter-btn {
  flex: 1;
  padding: 12px 5px;
  border-radius: 22px;
  border: 1px solid #555;
  background: #242424;
  color: white;
  font-weight: bold;
}

.filter-btn.active {
  background: #1DB954;
  color: black;
  border-color: #1DB954;
}

button.main,
button.secondary {
  display: block;
  width: 100%;
  border: none;
  border-radius: 30px;
  font-weight: bold;
}

button.main {
  background: #1DB954;
  color: black;
  padding: 16px;
  font-size: 18px;
  margin: 20px 0;
}

button.secondary {
  background: #333;
  color: white;
  padding: 14px;
  font-size: 16px;
  margin-bottom: 14px;
}

.status {
  text-align: center;
  color: #b3b3b3;
  margin: 20px 0;
  line-height: 1.5;
}

.release {
  background: #242424;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 12px;
  display: flex;
  gap: 14px;
  align-items: center;
}

.cover {
  width: 90px;
  height: 90px;
  object-fit: cover;
  border-radius: 6px;
}

.release-info {
  flex: 1;
  min-width: 0;
}

.release-name {
  font-size: 17px;
  font-weight: bold;
}

.artist {
  color: #b3b3b3;
  margin-top: 4px;
}

.meta {
  color: #999;
  font-size: 13px;
  margin-top: 5px;
}

.spotify-link {
  display: block;
  color: #1DB954;
  text-decoration: none;
  font-weight: bold;
  margin-top: 8px;
}

.diagnostics {
  background: #1c1c1c;
  border-radius: 12px;
  padding: 15px;
  margin: 20px 0;
}

.diagnostic {
  border-bottom: 1px solid #333;
  padding: 12px 0;
  line-height: 1.45;
}

.diagnostic:last-child {
  border-bottom: none;
}

.good {
  color: #1DB954;
}

.warning {
  color: #ffcc66;
}

.small {
  color: #999;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎵 New Country Music Finder</h1>

<p class="subtitle">
Diagnostic version — verifies what Spotify actually returns.
</p>

<button
  id="loginButton"
  class="main"
  onclick="loginWithSpotify()"
>
Connect Spotify
</button>

<div id="controls" style="display:none;">

  <div class="filters">

    <button
      id="todayButton"
      class="filter-btn"
      onclick="setRange('today')"
    >
      Today
    </button>

    <button
      id="weekButton"
      class="filter-btn active"
      onclick="setRange('week')"
    >
      7 Days
    </button>

    <button
      id="monthButton"
      class="filter-btn"
      onclick="setRange('month')"
    >
      30 Days
    </button>

  </div>

  <button
    class="main"
    onclick="runDiagnostic()"
  >
    Check Priority Artists
  </button>

  <button
    class="secondary"
    onclick="logout()"
  >
    Disconnect Spotify
  </button>

</div>

<div id="status" class="status">
Connect Spotify to begin.
</div>

<div id="diagnostics"></div>

<div id="results"></div>

</div>

<script>

const clientId =
  "ec35e5f54f2946e18aa9086b4a89fd17";

const redirectUri =
  "https://mbmcginn.github.io/New-country-music/";

let selectedRange = "week";


/*
  These are the four artists
  we're specifically testing.
*/

const priorityArtists = [
  "Mountain Grass Unit",
  "Alabama Shakes",
  "Silverada",
  "Red Shahan"
];


/* -----------------------------
   RANGE
----------------------------- */

function setRange(range) {

  selectedRange = range;

  document
    .getElementById("todayButton")
    .classList.toggle(
      "active",
      range === "today"
    );

  document
    .getElementById("weekButton")
    .classList.toggle(
      "active",
      range === "week"
    );

  document
    .getElementById("monthButton")
    .classList.toggle(
      "active",
      range === "month"
    );

  displaySavedDiagnosticResults();
}


/* -----------------------------
   LOGIN
----------------------------- */

function randomString(length) {

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for (
    let i = 0;
    i < length;
    i++
  ) {

    result += chars.charAt(
      Math.floor(
        Math.random() *
        chars.length
      )
    );
  }

  return result;
}


async function sha256(text) {

  return crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(text)
  );
}


function base64url(buffer) {

  return btoa(
    String.fromCharCode(
      ...new Uint8Array(buffer)
    )
  )
  .replace(/=/g, "")
  .replace(/\+/g, "-")
  .replace(/\//g, "_");
}


async function loginWithSpotify() {

  const verifier =
    randomString(64);

  localStorage.setItem(
    "code_verifier",
    verifier
  );

  const challenge =
    base64url(
      await sha256(verifier)
    );

  const url =
    new URL(
      "https://accounts.spotify.com/authorize"
    );

  url.search =
    new URLSearchParams({

      client_id:
        clientId,

      response_type:
        "code",

      redirect_uri:
        redirectUri,

      code_challenge_method:
        "S256",

      code_challenge:
        challenge

    }).toString();

  location.href =
    url.toString();
}


/* -----------------------------
   TOKEN
----------------------------- */

async function getToken(code) {

  const verifier =
    localStorage.getItem(
      "code_verifier"
    );

  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {

        method:
          "POST",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body:
          new URLSearchParams({

            client_id:
              clientId,

            grant_type:
              "authorization_code",

            code:
              code,

            redirect_uri:
              redirectUri,

            code_verifier:
              verifier

          })
      }
    );

  const data =
    await response.json();

  if (
    data.access_token
  ) {

    localStorage.setItem(
      "spotify_access_token",
      data.access_token
    );
  }

  return data;
}


/* -----------------------------
   CALLBACK
----------------------------- */

async function handleCallback() {

  const params =
    new URLSearchParams(
      location.search
    );

  const code =
    params.get("code");

  if (code) {

    document
      .getElementById("status")
      .innerText =
        "Connecting to Spotify...";

    const data =
      await getToken(code);

    history.replaceState(
      {},
      document.title,
      redirectUri
    );

    if (
      data.access_token
    ) {

      showConnected();

    } else {

      document
        .getElementById("status")
        .innerText =
          "Spotify connection failed.";
    }

  } else {

    if (
      localStorage.getItem(
        "spotify_access_token"
      )
    ) {

      showConnected();
    }
  }
}


function showConnected() {

  document
    .getElementById("loginButton")
    .style.display =
      "none";

  document
    .getElementById("controls")
    .style.display =
      "block";

  document
    .getElementById("status")
    .innerText =
      "Ready. Tap Check Priority Artists.";

  displaySavedDiagnosticResults();
}


/* -----------------------------
   SPOTIFY FETCH
----------------------------- */

async function spotifyFetch(
  url,
  token
) {

  const response =
    await fetch(
      url,
      {
        headers: {
          Authorization:
            "Bearer " + token
        }
      }
    );

  if (
    response.status === 401
  ) {

    throw new Error(
      "SESSION_EXPIRED"
    );
  }

  if (
    response.status === 429
  ) {

    let body = {};

    try {
      body =
        await response.json();
    } catch (e) {}

    if (
      body?.error?.reason ===
        "QUOTA_EXCEEDED" ||
      body?.reason ===
        "QUOTA_EXCEEDED"
    ) {

      throw new Error(
        "QUOTA_EXCEEDED"
      );
    }

    const retryAfter =
      response.headers.get(
        "Retry-After"
      );

    throw new Error(
      "RATE_LIMIT:" +
      (retryAfter || "?")
    );
  }

  if (
    !response.ok
  ) {

    const body =
      await response.text();

    console.error(
      response.status,
      body
    );

    throw new Error(
      "SPOTIFY_ERROR_" +
      response.status
    );
  }

  return response.json();
}


/* -----------------------------
   OLD CACHE LOOKUP

   Reuse Spotify IDs from your
   existing hybrid cache if present.
----------------------------- */

function getExistingArtistId(
  requestedName
) {

  try {

    const oldCache =
      JSON.parse(
        localStorage.getItem(
          "hybrid_release_cache"
        )
      );

    if (
      !oldCache ||
      !oldCache.direct
    ) {
      return null;
    }

    const entry =
      oldCache.direct[
        requestedName
      ];

    if (
      entry &&
      entry.artistId
    ) {
      return entry.artistId;
    }

  } catch (e) {}

  return null;
}


/* -----------------------------
   NORMALIZE
----------------------------- */

function normalize(text) {

  return (
    text || ""
  )
  .toLowerCase()
  .replace(
    /[^a-z0-9]/g,
    ""
  );
}


/* -----------------------------
   FIND ARTIST
----------------------------- */

async function findArtist(
  name,
  token
) {

  const data =
    await spotifyFetch(

      "https://api.spotify.com/v1/search?" +

      new URLSearchParams({

        q:
          `artist:"${name}"`,

        type:
          "artist",

        market:
          "US",

        limit:
          "5"

      }),

      token
    );

  const items =
    data.artists?.items || [];

  const exact =
    items.find(
      artist =>
        normalize(
          artist.name
        ) ===
        normalize(name)
    );

  return {
    exact:
      exact || null,

    candidates:
      items.map(
        artist => ({
          id:
            artist.id,
          name:
            artist.name,
          spotify:
            artist.external_urls
              ?.spotify || ""
        })
      )
  };
}


/* -----------------------------
   ARTIST ALBUMS
----------------------------- */

async function getArtistAlbums(
  artistId,
  token
) {

  const data =
    await spotifyFetch(

      "https://api.spotify.com/v1/artists/" +
      artistId +
      "/albums?" +

      new URLSearchParams({

        include_groups:
          "album,single",

        market:
          "US",

        limit:
          "10",

        offset:
          "0"

      }),

      token
    );

  return data.items || [];
}


/* -----------------------------
   DATE RANGE
----------------------------- */

function releasePassesDate(
  release
) {

  if (
    !release.release_date
  ) {
    return false;
  }

  /*
    Spotify can return year,
    month or day precision.
    For diagnostics, don't
    silently reject month/year
    precision — only exact-day
    results are date-filtered.
  */

  if (
    release.release_date_precision
      !== "day"
  ) {

    return true;
  }

  const now =
    new Date();

  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const cutoff =
    new Date(today);

  if (
    selectedRange ===
    "week"
  ) {

    cutoff.setDate(
      cutoff.getDate() - 6
    );

  } else if (
    selectedRange ===
    "month"
  ) {

    cutoff.setDate(
      cutoff.getDate() - 29
    );
  }

  const date =
    new Date(
      release.release_date +
      "T00:00:00"
    );

  return (
    date >= cutoff &&
    date <= now
  );
}


/* -----------------------------
   RUN DIAGNOSTIC
----------------------------- */

async function runDiagnostic() {

  const token =
    localStorage.getItem(
      "spotify_access_token"
    );

  if (!token) {

    loginWithSpotify();
    return;
  }

  const status =
    document.getElementById(
      "status"
    );

  const diagnostics = [];

  const allReleases = [];

  try {

    for (
      let i = 0;
      i < priorityArtists.length;
      i++
    ) {

      const requestedName =
        priorityArtists[i];

      status.innerText =
        `Checking ${i + 1} of ${priorityArtists.length}: ${requestedName}`;


      /*
        First see if an ID was
        preserved from previous cache.
      */

      let artistId =
        getExistingArtistId(
          requestedName
        );

      let matchedName =
        null;

      let candidates = [];

      let lookupMethod =
        "existing cache";


      if (!artistId) {

        const search =
          await findArtist(
            requestedName,
            token
          );

        candidates =
          search.candidates;

        if (
          search.exact
        ) {

          artistId =
            search.exact.id;

          matchedName =
            search.exact.name;

          lookupMethod =
            "Spotify search";
        }
      }


      if (!artistId) {

        diagnostics.push({

          requestedName:
            requestedName,

          found:
            false,

          candidates:
            candidates,

          releases:
            []

        });

        continue;
      }


      const albums =
        await getArtistAlbums(
          artistId,
          token
        );


      if (
        !matchedName &&
        albums.length
      ) {

        matchedName =
          albums[0]
            ?.artists?.find(
              a =>
                a.id === artistId
            )?.name ||
          requestedName;
      }


      /*
        Sort newest first.
      */

      albums.sort(
        (a, b) =>
          (
            b.release_date || ""
          ).localeCompare(
            a.release_date || ""
          )
      );


      diagnostics.push({

        requestedName:
          requestedName,

        found:
          true,

        artistId:
          artistId,

        matchedName:
          matchedName ||
          requestedName,

        lookupMethod:
          lookupMethod,

        candidates:
          candidates,

        releases:
          albums

      });


      allReleases.push(
        ...albums.map(
          release => ({
            ...release,
            diagnosticArtist:
              requestedName
          })
        )
      );


      /*
        Small pause to avoid
        hammering Spotify.
      */

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            600
          )
      );
    }


    localStorage.setItem(
      "priority_diagnostics",
      JSON.stringify({

        checkedAt:
          Date.now(),

        artists:
          diagnostics

      })
    );


    status.innerText =
      "Priority artist check complete.";

    displayDiagnostics(
      diagnostics
    );

    displayReleases(
      allReleases
    );

  } catch (error) {

    console.error(error);

    if (
      error.message ===
      "QUOTA_EXCEEDED"
    ) {

      status.innerHTML =
        "<b>Spotify development quota reached.</b><br>" +
        "Do not keep retrying. Existing diagnostic data is shown below.";

      displaySavedDiagnosticResults();
      return;
    }


    if (
      error.message.startsWith(
        "RATE_LIMIT"
      )
    ) {

      const seconds =
        error.message.split(":")[1];

      status.innerHTML =
        "Spotify rate-limited the request." +
        (
          seconds !== "?"
            ? `<br>Retry after approximately ${seconds} seconds.`
            : ""
        );

      return;
    }


    if (
      error.message ===
      "SESSION_EXPIRED"
    ) {

      localStorage.removeItem(
        "spotify_access_token"
      );

      status.innerText =
        "Spotify session expired. Disconnect and reconnect.";

      return;
    }


    status.innerText =
      "Spotify returned an unexpected error.";
  }
}


/* -----------------------------
   DISPLAY DIAGNOSTICS
----------------------------- */

function displayDiagnostics(
  diagnostics
) {

  const container =
    document.getElementById(
      "diagnostics"
    );

  container.innerHTML =
    "<div class='diagnostics'><b>Spotify diagnostic</b></div>";

  const box =
    container.firstElementChild;


  diagnostics.forEach(
    item => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "diagnostic";


      if (!item.found) {

        div.innerHTML =
          `<b>${escapeHtml(item.requestedName)}</b><br>
           <span class="warning">
             Exact Spotify artist match NOT found.
           </span>`;

        if (
          item.candidates?.length
        ) {

          div.innerHTML +=
            `<div class="small">
              Spotify suggested:
              ${item.candidates
                .map(
                  c =>
                    escapeHtml(
                      c.name
                    )
                )
                .join(", ")}
            </div>`;
        }

        box.appendChild(div);
        return;
      }


      const newest =
        item.releases?.[0];


      div.innerHTML =

        `<b>${escapeHtml(item.requestedName)}</b><br>

         <span class="good">
           ✓ Spotify artist found
         </span><br>

         <span class="small">
           Matched as:
           ${escapeHtml(item.matchedName)}
           <br>
           ID:
           ${escapeHtml(item.artistId)}
           <br>
           Lookup:
           ${escapeHtml(item.lookupMethod)}
         </span>`;


      if (
        newest
      ) {

        div.innerHTML +=

          `<br><br>
           Latest item returned:<br>
           <b>${escapeHtml(newest.name)}</b><br>
           ${escapeHtml(newest.release_date || "No date")}
           (${escapeHtml(newest.release_date_precision || "unknown precision")})
           <br>
           Spotify returned ${item.releases.length} recent catalog items.`;

      } else {

        div.innerHTML +=

          `<br><br>
           <span class="warning">
             Spotify returned zero albums/singles for this artist.
           </span>`;
      }


      box.appendChild(
        div
      );
    }
  );
}


/* -----------------------------
   DISPLAY RELEASES
----------------------------- */

function displayReleases(
  releases
) {

  const results =
    document.getElementById(
      "results"
    );

  results.innerHTML =
    "";


  const unique =
    Array.from(
      new Map(
        releases
          .filter(
            r => r?.id
          )
          .map(
            r => [
              r.id,
              r
            ]
          )
      ).values()
    );


  const filtered =
    unique
      .filter(
        releasePassesDate
      )
      .sort(
        (a, b) =>
          (
            b.release_date || ""
          ).localeCompare(
            a.release_date || ""
          )
      );


  if (
    filtered.length === 0
  ) {

    results.innerHTML =
      "<div class='status'>No releases passed the selected date filter.</div>";

    return;
  }


  filtered.forEach(
    release => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "release";


      const artists =
        (release.artists || [])
          .map(
            artist =>
              artist.name
          )
          .join(", ");


      const image =
        release.images?.[1]?.url ||
        release.images?.[0]?.url ||
        "";


      div.innerHTML = `

        ${
          image
            ? `<img
                class="cover"
                src="${image}"
                alt="Spotify artwork"
              >`
            : ""
        }

        <div class="release-info">

          <div class="release-name">
            ${escapeHtml(release.name)}
          </div>

          <div class="artist">
            ${escapeHtml(artists)}
          </div>

          <div class="meta">
            Released:
            ${escapeHtml(release.release_date || "unknown")}
            •
            ${escapeHtml(release.album_type || "release")}
          </div>

          <a
            class="spotify-link"
            href="${release.external_urls?.spotify || "#"}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ▶ Open in Spotify
          </a>

        </div>
      `;


      results.appendChild(
        div
      );
    }
  );
}


/* -----------------------------
   SAVED DIAGNOSTICS
----------------------------- */

function displaySavedDiagnosticResults() {

  try {

    const saved =
      JSON.parse(
        localStorage.getItem(
          "priority_diagnostics"
        )
      );

    if (
      !saved ||
      !saved.artists
    ) {
      return;
    }

    displayDiagnostics(
      saved.artists
    );

    const releases = [];

    saved.artists.forEach(
      item => {

        releases.push(
          ...(item.releases || [])
        );
      }
    );

    displayReleases(
      releases
    );

  } catch (e) {}
}


/* -----------------------------
   SAFETY
----------------------------- */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text || "";

  return div.innerHTML;
}


/* -----------------------------
   LOGOUT
----------------------------- */

function logout() {

  localStorage.removeItem(
    "spotify_access_token"
  );

  localStorage.removeItem(
    "code_verifier"
  );

  location.reload();
}


/* START */

handleCallback();

</script>

</body>
  </html>
