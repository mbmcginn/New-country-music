<div class="container">

<script>

const clientId =
  "ec35e5f54f2946e18aa9086b4a89fd17";

const redirectUri =
  "https://mbmcginn.github.io/New-country-music/";

const CACHE_HOURS = 24;
const ARTISTS_PER_RUN = 8;

let selectedRange = "week";


const defaultTrustedArtists = [

  "Mountain Grass Unit",
  "Alabama Shakes",
  "Silverada",
  "Red Shahan",
  "Turnpike Troubadours",
  "Shane Smith & the Saints",
  "Cody Jinks",

  "Jason Isbell",
  "Whiskey Myers",

  "Flatland Cavalry",
  "American Aquarium",
  "Parker McCollum",
  "Kaitlin Butts",
  "Zach Bryan",
  "Ryan Bingham",
  "Reckless Kelly",
  "Micky and the Motorcars",
  "Treaty Oak Revival",
  "William Clark Green",
  "Josh Meloy",
  "Hayes Carll",
  "Corb Lund",
  "Colter Wall",
  "The Steel Woods",
  "Ward Davis",
  "Josh Abbott Band",
  "Randy Rogers Band"

/* -----------------------------
   RANGE
----------------------------- */

function setRange(range) {

  selectedRange = range;

  document
    .getElementById("todayButton")
    .classList.toggle("active", range === "today");

  document
    .getElementById("weekButton")
    .classList.toggle("active", range === "week");

  document
    .getElementById("monthButton")
    .classList.toggle("active", range === "month");

  displayCachedResults();
}


/* -----------------------------
   TRUSTED ARTISTS
----------------------------- */

function getTrustedArtists() {

  const saved =
    localStorage.getItem("trusted_artists");

  if (!saved) {
    return defaultTrustedArtists;
  }

  try {

    const parsed =
      JSON.parse(saved);

    if (
      Array.isArray(parsed) &&
      parsed.length > 0
    ) {
      return parsed;
    }

  } catch (e) {}

  return defaultTrustedArtists;
}


function toggleArtistEditor() {

  const editor =
    document.getElementById("artistEditor");

  editor.style.display =
    editor.style.display === "none"
      ? "block"
      : "none";

  document.getElementById("artistList").value =
    getTrustedArtists().join("\n");
}


function saveTrustedArtists() {

  const oldArtists =
    getTrustedArtists();

  const newArtists =
    document
      .getElementById("artistList")
      .value
      .split("\n")
      .map(x => x.trim())
      .filter(Boolean);

  localStorage.setItem(
    "trusted_artists",
    JSON.stringify(newArtists)
  );


  /*
    Put newly added artists at
    the front of the next-check queue.
  */

  const oldSet =
    new Set(
      oldArtists.map(normalize)
    );

  const newlyAdded =
    newArtists.filter(
      name =>
        !oldSet.has(
          normalize(name)
        )
    );

  if (newlyAdded.length) {

    localStorage.setItem(
      "priority_artist_queue",
      JSON.stringify(newlyAdded)
    );
  }


  document
    .getElementById("artistEditor")
    .style.display =
      "none";

  document
    .getElementById("status")
    .innerText =
      newlyAdded.length
        ? `${newlyAdded.length} new artist(s) saved and prioritized.`
        : "Trusted artist list saved.";
}


/* -----------------------------
   NORMALIZE
----------------------------- */

function normalize(text) {

  return (
    text || ""
  )
  .toLowerCase()
  .replace(/[^a-z0-9]/g, "");
}


/* -----------------------------
   PKCE LOGIN
----------------------------- */

function randomString(length) {

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for (let i = 0; i < length; i++) {

    result += chars.charAt(
      Math.floor(
        Math.random() *
        chars.length
      )
    );
  }

  return result;
}


async function sha256(text) {

  return crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(text)
  );
}


function base64url(buffer) {

  return btoa(
    String.fromCharCode(
      ...new Uint8Array(buffer)
    )
  )
  .replace(/=/g, "")
  .replace(/\+/g, "-")
  .replace(/\//g, "_");
}


async function loginWithSpotify() {

  const verifier =
    randomString(64);

  localStorage.setItem(
    "code_verifier",
    verifier
  );

  const challenge =
    base64url(
      await sha256(verifier)
    );

  const state =
    randomString(24);

  localStorage.setItem(
    "spotify_auth_state",
    state
  );

  const url =
    new URL(
      "https://accounts.spotify.com/authorize"
    );

  url.search =
    new URLSearchParams({

      client_id:
        clientId,

      response_type:
        "code",

      redirect_uri:
        redirectUri,

      code_challenge_method:
        "S256",

      code_challenge:
        challenge,

      state:
        state

    }).toString();

  location.href =
    url.toString();
}


/* -----------------------------
   TOKEN EXCHANGE
----------------------------- */

async function exchangeCode(code) {

  const verifier =
    localStorage.getItem(
      "code_verifier"
    );

  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {

        method:
          "POST",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body:
          new URLSearchParams({

            client_id:
              clientId,

            grant_type:
              "authorization_code",

            code:
              code,

            redirect_uri:
              redirectUri,

            code_verifier:
              verifier

          })
      }
    );

  const data =
    await response.json();

  saveTokenData(data);

  return data;
}


/* -----------------------------
   SAVE TOKENS
----------------------------- */

function saveTokenData(data) {

  if (
    data.access_token
  ) {

    localStorage.setItem(
      "spotify_access_token",
      data.access_token
    );

    localStorage.setItem(
      "spotify_token_expires",
      String(
        Date.now() +
        (
          (data.expires_in || 3600) -
          60
        ) *
        1000
      )
    );
  }

  if (
    data.refresh_token
  ) {

    localStorage.setItem(
      "spotify_refresh_token",
      data.refresh_token
    );
  }
}


/* -----------------------------
   REFRESH TOKEN
----------------------------- */

async function refreshAccessToken() {

  const refreshToken =
    localStorage.getItem(
      "spotify_refresh_token"
    );

  if (!refreshToken) {
    return null;
  }

  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {

        method:
          "POST",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body:
          new URLSearchParams({

            grant_type:
              "refresh_token",

            refresh_token:
              refreshToken,

            client_id:
              clientId

          })
      }
    );


  if (!response.ok) {

    clearTokens();
    return null;
  }


  const data =
    await response.json();

  saveTokenData(data);

  return data.access_token || null;
}


/* -----------------------------
   GET VALID TOKEN
----------------------------- */

async function getValidToken() {

  const token =
    localStorage.getItem(
      "spotify_access_token"
    );

  const expires =
    Number(
      localStorage.getItem(
        "spotify_token_expires"
      ) || 0
    );


  if (
    token &&
    Date.now() < expires
  ) {

    return token;
  }


  return await refreshAccessToken();
}


/* -----------------------------
   CALLBACK
----------------------------- */

async function handleCallback() {

  const params =
    new URLSearchParams(
      location.search
    );

  const code =
    params.get("code");

  const returnedState =
    params.get("state");


  if (code) {

    const expectedState =
      localStorage.getItem(
        "spotify_auth_state"
      );


    if (
      !expectedState ||
      returnedState !== expectedState
    ) {

      document
        .getElementById("status")
        .innerText =
          "Spotify login validation failed.";

      return;
    }


    document
      .getElementById("status")
      .innerText =
        "Connecting to Spotify...";


    const data =
      await exchangeCode(code);


    history.replaceState(
      {},
      document.title,
      redirectUri
    );


    localStorage.removeItem(
      "spotify_auth_state"
    );


    if (
      data.access_token
    ) {

      showConnected();

    } else {

      document
        .getElementById("status")
        .innerText =
          "Spotify connection failed.";
    }

  } else {

    const token =
      await getValidToken();

    if (token) {

      showConnected();
    }
  }
}


function showConnected() {

  document
    .getElementById("loginButton")
    .style.display =
      "none";

  document
    .getElementById("controls")
    .style.display =
      "block";

  document
    .getElementById("status")
    .innerText =
      "Spotify connected.";

  displayCachedResults();
}


/* -----------------------------
   CACHE
----------------------------- */

function getCache() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "artist_release_cache_v2"
      )
    ) || {
      artists: {},
      rotation: 0
    };

  } catch (e) {

    return {
      artists: {},
      rotation: 0
    };
  }
}


function saveCache(cache) {

  localStorage.setItem(
    "artist_release_cache_v2",
    JSON.stringify(cache)
  );
}


function isFresh(entry) {

  if (
    !entry ||
    !entry.checkedAt
  ) {
    return false;
  }

  return (
    Date.now() -
    entry.checkedAt
  ) <
  CACHE_HOURS *
  60 *
  60 *
  1000;
}


/* -----------------------------
   SPOTIFY FETCH
----------------------------- */

async function spotifyFetch(url) {

  let token =
    await getValidToken();


  if (!token) {

    throw new Error(
      "SESSION_EXPIRED"
    );
  }


  let response =
    await fetch(
      url,
      {
        headers: {
          Authorization:
            "Bearer " + token
        }
      }
    );


  /*
    If token expired unexpectedly,
    refresh once and retry.
  */

  if (
    response.status === 401
  ) {

    token =
      await refreshAccessToken();


    if (!token) {

      throw new Error(
        "SESSION_EXPIRED"
      );
    }


    response =
      await fetch(
        url,
        {
          headers: {
            Authorization:
              "Bearer " + token
          }
        }
      );
  }


  if (
    response.status === 429
  ) {

    let body = {};

    try {

      body =
        await response.json();

    } catch (e) {}


    if (
      body?.reason ===
        "QUOTA_EXCEEDED" ||
      body?.error?.reason ===
        "QUOTA_EXCEEDED"
    ) {

      throw new Error(
        "QUOTA_EXCEEDED"
      );
    }


    throw new Error(
      "RATE_LIMIT"
    );
  }


  if (
    !response.ok
  ) {

    throw new Error(
      "SPOTIFY_ERROR"
    );
  }


  return response.json();
}


/* -----------------------------
   ARTIST LOOKUP
----------------------------- */

async function findArtistByName(name) {

  const data =
    await spotifyFetch(

      "https://api.spotify.com/v1/search?" +

      new URLSearchParams({

        q:
          `artist:"${name}"`,

        type:
          "artist",

        market:
          "US",

        limit:
          "5"

      })
    );


  const items =
    data.artists?.items || [];


  return (
    items.find(
      artist =>
        normalize(
          artist.name
        ) ===
        normalize(name)
    ) || null
  );
}


/* -----------------------------
   ARTIST RELEASES
----------------------------- */

async function getArtistReleases(
  artistId
) {

  const data =
    await spotifyFetch(

      "https://api.spotify.com/v1/artists/" +
      artistId +
      "/albums?" +

      new URLSearchParams({

        include_groups:
          "album,single",

        market:
          "US",

        limit:
          "10",

        offset:
          "0"

      })
    );


  return (
    data.items || []
  );
}


/* -----------------------------
   DATE FILTER
----------------------------- */

function passesDateFilter(
  release
) {

  if (
    !release.release_date ||
    release.release_date_precision !==
      "day"
  ) {

    return false;
  }


  const now =
    new Date();


  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );


  const cutoff =
    new Date(today);


  if (
    selectedRange ===
    "week"
  ) {

    cutoff.setDate(
      cutoff.getDate() - 6
    );

  } else if (
    selectedRange ===
    "month"
  ) {

    cutoff.setDate(
      cutoff.getDate() - 29
    );
  }


  const releaseDate =
    new Date(
      release.release_date +
      "T00:00:00"
    );


  return (
    releaseDate >= cutoff &&
    releaseDate <= now
  );
}


/* -----------------------------
   BUILD CHECK QUEUE
----------------------------- */

function getArtistsToCheck(
  trustedArtists,
  cache
) {

  let priority = [];

  try {

    priority =
      JSON.parse(
        localStorage.getItem(
          "priority_artist_queue"
        )
      ) || [];

  } catch (e) {}


  const prioritySet =
    new Set(
      priority.map(normalize)
    );


  const stale =
    trustedArtists.filter(
      name => {

        if (
          prioritySet.has(
            normalize(name)
          )
        ) {
          return false;
        }

        return !isFresh(
          cache.artists[
            normalize(name)
          ]
        );
      }
    );


  /*
    Priority artists first.
  */

  const queue = [
    ...priority,
    ...stale
  ];


  /*
    If everything is fresh,
    rotate through the list
    so older caches gradually
    get refreshed.
  */

  if (
    queue.length === 0
  ) {

    const start =
      cache.rotation || 0;

    for (
      let i = 0;
      i < ARTISTS_PER_RUN;
      i++
    ) {

      queue.push(
        trustedArtists[
          (
            start + i
          ) %
          trustedArtists.length
        ]
      );
    }
  }


  return Array.from(
    new Map(
      queue.map(
        name => [
          normalize(name),
          name
        ]
      )
    ).values()
  ).slice(
    0,
    ARTISTS_PER_RUN
  );
}


/* -----------------------------
   FIND NEW MUSIC
----------------------------- */

async function findNewMusic() {

  const status =
    document.getElementById(
      "status"
    );


  const trustedArtists =
    getTrustedArtists();


  const cache =
    getCache();


  const queue =
    getArtistsToCheck(
      trustedArtists,
      cache
    );


  if (
    queue.length === 0
  ) {

    displayCachedResults();
    return;
  }


  try {

    for (
      let i = 0;
      i < queue.length;
      i++
    ) {

      const name =
        queue[i];

      const key =
        normalize(name);

      let entry =
        cache.artists[key] || {};


      status.innerText =
        `Checking ${i + 1} of ${queue.length}: ${name}`;


      let artistId =
        entry.artistId || null;


      if (!artistId) {

        const artist =
          await findArtistByName(
            name
          );


        if (!artist) {

          cache.artists[key] = {
            artistName:
              name,

            artistId:
              null,

            checkedAt:
              Date.now(),

            releases:
              []
          };

          saveCache(cache);

          continue;
        }


        artistId =
          artist.id;
      }


      const releases =
        await getArtistReleases(
          artistId
        );


      cache.artists[key] = {

        artistName:
          name,

        artistId:
          artistId,

        checkedAt:
          Date.now(),

        releases:
          releases
      };


      saveCache(cache);


      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            600
          )
      );
    }


    /*
      Remove any checked priority
      artists from priority queue.
    */

    try {

      const oldPriority =
        JSON.parse(
          localStorage.getItem(
            "priority_artist_queue"
          )
        ) || [];


      const checked =
        new Set(
          queue.map(normalize)
        );


      const remaining =
        oldPriority.filter(
          name =>
            !checked.has(
              normalize(name)
            )
        );


      localStorage.setItem(
        "priority_artist_queue",
        JSON.stringify(
          remaining
        )
      );

    } catch (e) {}


    cache.rotation =
      (
        (cache.rotation || 0) +
        ARTISTS_PER_RUN
      ) %
      trustedArtists.length;


    saveCache(cache);


    displayCachedResults();


  } catch (error) {


    if (
      error.message ===
      "QUOTA_EXCEEDED"
    ) {

      status.innerHTML =
        "<b>Spotify quota reached.</b><br><br>" +
        "Showing your cached results.";

      displayCachedResults();
      return;
    }


    if (
      error.message ===
      "RATE_LIMIT"
    ) {

      status.innerHTML =
        "Spotify asked us to slow down.<br><br>" +
        "Showing your cached results.";

      displayCachedResults();
      return;
    }


    if (
      error.message ===
      "SESSION_EXPIRED"
    ) {

      clearTokens();

      status.innerText =
        "Spotify authorization expired. Reconnect Spotify.";

      document
        .getElementById("controls")
        .style.display =
          "none";

      document
        .getElementById("loginButton")
        .style.display =
          "block";

      return;
    }


    status.innerText =
      "Something went wrong while checking Spotify.";
  }
}


/* -----------------------------
   DISPLAY CACHE
----------------------------- */

function displayCachedResults() {

  const cache =
    getCache();


  let releases = [];


  Object.values(
    cache.artists || {}
  ).forEach(
    entry => {

      if (
        Array.isArray(
          entry.releases
        )
      ) {

        releases.push(
          ...entry.releases
        );
      }
    }
  );


  const unique =
    Array.from(
      new Map(
        releases
          .filter(
            release =>
              release?.id
          )
          .map(
            release => [
              release.id,
              release
            ]
          )
      ).values()
    );


  const filtered =
    unique
      .filter(
        passesDateFilter
      )
      .sort(
        (a, b) =>
          b.release_date
            .localeCompare(
              a.release_date
            )
      );


  displayReleases(
    filtered,
    Object.keys(
      cache.artists || {}
    ).length
  );
}


/* -----------------------------
   DISPLAY RELEASES
----------------------------- */

function displayReleases(
  releases,
  cachedCount
) {

  const status =
    document.getElementById(
      "status"
    );

  const results =
    document.getElementById(
      "results"
    );


  results.innerHTML =
    "";


  if (
    releases.length === 0
  ) {

    const label =
      selectedRange === "today"
        ? "today"
        : selectedRange === "week"
          ? "in the last 7 days"
          : "in the last 30 days";


    status.innerHTML =
      `No trusted releases found ${label}.` +

      `<div class="small">
        ${cachedCount} artists currently cached.
      </div>`;

    return;
  }


  status.innerHTML =
    `<b>${releases.length} new releases found</b>` +

    `<div class="small">
      ${cachedCount} artists currently cached.
    </div>`;


  releases.forEach(
    release => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "release";


      const artists =
        (release.artists || [])
          .map(
            artist =>
              artist.name
          )
          .join(", ");


      const image =
        release.images?.[1]?.url ||
        release.images?.[0]?.url ||
        "";


      const type =
        release.album_type ===
        "album"
          ? "Album"
          : "Single / EP";


      div.innerHTML = `

        ${
          image
            ? `<img
                class="cover"
                src="${image}"
                alt="Spotify artwork"
              >`
            : ""
        }

        <div class="release-info">

          <div class="release-name">
            ${escapeHtml(
              release.name
            )}
          </div>

          <div class="artist">
            ${escapeHtml(
              artists
            )}
          </div>

          <div class="meta">
            Released:
            ${escapeHtml(
              release.release_date
            )}
            • ${type}
          </div>

          <a
            class="spotify-link"
            href="${release.external_urls?.spotify || "#"}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ▶ Open in Spotify
          </a>

        </div>
      `;


      results.appendChild(
        div
      );
    }
  );
}


/* -----------------------------
   SAFETY
----------------------------- */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text || "";

  return div.innerHTML;
}


/* -----------------------------
   TOKEN CLEANUP
----------------------------- */

function clearTokens() {

  localStorage.removeItem(
    "spotify_access_token"
  );

  localStorage.removeItem(
    "spotify_refresh_token"
  );

  localStorage.removeItem(
    "spotify_token_expires"
  );

  localStorage.removeItem(
    "code_verifier"
  );
}


/* -----------------------------
   DISCONNECT
----------------------------- */

function logout() {

  clearTokens();

  location.reload();
}


/* START */

handleCallback();

</script>
