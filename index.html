<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>New Country Music Finder</title>

<style>

body {
  font-family: Arial, sans-serif;
  background:#121212;
  color:white;
  margin:0;
  padding:20px;
}

.container {
  max-width:720px;
  margin:auto;
}

h1 {
  text-align:center;
  margin-top:25px;
}

.subtitle {
  text-align:center;
  color:#b3b3b3;
  line-height:1.4;
}

.filters {
  display:flex;
  gap:10px;
  margin-top:20px;
}

.filter-btn {
  flex:1;
  padding:12px;
  border-radius:22px;
  border:1px solid #555;
  background:#242424;
  color:white;
  font-weight:bold;
}

.filter-btn.active {
  background:#1DB954;
  color:black;
  border-color:#1DB954;
}

button.main,
button.secondary {
  display:block;
  width:100%;
  border:none;
  border-radius:30px;
  font-weight:bold;
}

button.main {
  background:#1DB954;
  color:black;
  padding:16px;
  font-size:18px;
  margin:20px 0;
}

button.secondary {
  background:#333;
  color:white;
  padding:14px;
  font-size:16px;
  margin-bottom:20px;
}

.status {
  text-align:center;
  color:#b3b3b3;
  margin:20px 0;
  line-height:1.5;
}

.release {
  background:#242424;
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
  display:flex;
  gap:14px;
  align-items:center;
}

.cover {
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:6px;
  flex-shrink:0;
}

.release-info {
  flex:1;
}

.release-name {
  font-size:17px;
  font-weight:bold;
}

.artist {
  color:#b3b3b3;
  margin-top:4px;
}

.meta {
  color:#999;
  font-size:13px;
  margin-top:5px;
}

.badge {
  display:inline-block;
  background:#174f2a;
  color:#b7f7c9;
  border-radius:12px;
  padding:3px 8px;
  font-size:11px;
  margin-top:6px;
}

.spotify-link {
  display:block;
  margin-top:9px;
  color:#1DB954;
  text-decoration:none;
  font-weight:bold;
}

.debug {
  font-size:12px;
  color:#777;
  margin-top:8px;
}

</style>
</head>

<body>

<div class="container">

<h1>🎵 New Country Music Finder</h1>

<p class="subtitle">
New releases from artists you follow, listen to,
or specifically trust.
</p>

<button
 id="loginButton"
 class="main"
 onclick="loginWithSpotify()">
 Connect Spotify
</button>


<div id="controls" style="display:none;">

<div class="filters">

<button
 id="todayButton"
 class="filter-btn active"
 onclick="setRange('today')">
 Today
</button>

<button
 id="weekButton"
 class="filter-btn"
 onclick="setRange('week')">
 Last 7 Days
</button>

</div>

<button
 class="main"
 onclick="findNewMusic()">
 Find New Music
</button>

<button
 class="secondary"
 onclick="logout()">
 Disconnect Spotify
</button>

</div>

<div id="status" class="status">
Connect Spotify to begin.
</div>

<div id="results"></div>

</div>


<script>

const clientId =
"ec35e5f54f2946e18aa9086b4a89fd17";

const redirectUri =
"https://mbmcginn.github.io/New-country-music/";

let selectedRange = "today";


/* -------------------------
DATE RANGE
------------------------- */

function setRange(range) {

 selectedRange = range;

 document
 .getElementById("todayButton")
 .classList.toggle(
   "active",
   range === "today"
 );

 document
 .getElementById("weekButton")
 .classList.toggle(
   "active",
   range === "week"
 );
}


/* -------------------------
LOGIN
------------------------- */

function randomString(length) {

 const chars =
 "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

 let result = "";

 for(let i=0;i<length;i++) {

   result += chars.charAt(
     Math.floor(
       Math.random()*chars.length
     )
   );
 }

 return result;
}


async function sha256(text) {

 return crypto.subtle.digest(
   "SHA-256",
   new TextEncoder().encode(text)
 );
}


function base64url(buffer) {

 return btoa(
   String.fromCharCode(
     ...new Uint8Array(buffer)
   )
 )
 .replace(/=/g,"")
 .replace(/\+/g,"-")
 .replace(/\//g,"_");
}


async function loginWithSpotify() {

 const verifier =
 randomString(64);

 localStorage.setItem(
   "code_verifier",
   verifier
 );

 const challenge =
 base64url(
   await sha256(verifier)
 );

 const url =
 new URL(
   "https://accounts.spotify.com/authorize"
 );

 url.search =
 new URLSearchParams({

   client_id:clientId,

   response_type:"code",

   redirect_uri:redirectUri,

   scope:
   "user-follow-read user-top-read",

   code_challenge_method:"S256",

   code_challenge:challenge

 }).toString();

 location.href =
 url.toString();
}


/* -------------------------
TOKEN
------------------------- */

async function getToken(code) {

 const verifier =
 localStorage.getItem(
   "code_verifier"
 );

 const response =
 await fetch(
   "https://accounts.spotify.com/api/token",
   {

   method:"POST",

   headers:{
     "Content-Type":
     "application/x-www-form-urlencoded"
   },

   body:new URLSearchParams({

     client_id:clientId,

     grant_type:
     "authorization_code",

     code:code,

     redirect_uri:
     redirectUri,

     code_verifier:
     verifier

   })

 });

 const data =
 await response.json();

 if(data.access_token) {

   localStorage.setItem(
     "spotify_access_token",
     data.access_token
   );
 }

 return data;
}


/* -------------------------
CALLBACK
------------------------- */

async function handleCallback() {

 const params =
 new URLSearchParams(
   location.search
 );

 const code =
 params.get("code");

 if(code) {

   document
   .getElementById("status")
   .innerText =
   "Connecting to Spotify...";

   const token =
   await getToken(code);

   history.replaceState(
     {},
     document.title,
     redirectUri
   );

   if(token.access_token) {

     showConnected();

   } else {

     document
     .getElementById("status")
     .innerText =
     "Spotify connection failed.";
   }

 } else {

   if(
     localStorage.getItem(
       "spotify_access_token"
     )
   ) {

     showConnected();
   }
 }
}


function showConnected() {

 document
 .getElementById("loginButton")
 .style.display =
 "none";

 document
 .getElementById("controls")
 .style.display =
 "block";

 document
 .getElementById("status")
 .innerText =
 "Spotify connected.";
}


/* -------------------------
WAIT
------------------------- */

function sleep(ms) {

 return new Promise(
   resolve =>
   setTimeout(resolve,ms)
 );
}


/* -------------------------
SPOTIFY FETCH
------------------------- */

async function spotifyFetch(
 url,
 token,
 retry=true
) {

 const response =
 await fetch(
   url,
   {
     headers:{
       Authorization:
       "Bearer "+token
     }
   }
 );


 if(response.status === 401) {

   throw new Error(
     "SESSION_EXPIRED"
   );
 }


 if(response.status === 429) {

   let body = {};

   try {
     body =
     await response.json();
   } catch(e) {}


   if(
     body?.error?.reason ===
     "QUOTA_EXCEEDED" ||

     body?.reason ===
     "QUOTA_EXCEEDED"
   ) {

     throw new Error(
       "QUOTA_EXCEEDED"
     );
   }


   const retryAfter =
   Number(
     response.headers.get(
       "Retry-After"
     ) || 5
   );


   if(retry) {

     document
     .getElementById("status")
     .innerText =
     "Spotify asked us to slow down. Waiting " +
     retryAfter +
     " seconds...";


     await sleep(
       (retryAfter+1)*1000
     );


     return spotifyFetch(
       url,
       token,
       false
     );
   }


   throw new Error(
     "RATE_LIMIT"
   );
 }


 if(!response.ok) {

   console.error(
     response.status,
     await response.text()
   );

   throw new Error(
     "SPOTIFY_ERROR"
   );
 }


 return response.json();
}


/* -------------------------
FOLLOWED ARTISTS
------------------------- */

async function getFollowedArtists(
 token
) {

 const data =
 await spotifyFetch(

   "https://api.spotify.com/v1/me/following?type=artist&limit=50",

   token
 );


 return (
   data.artists?.items || []
 ).map(
   artist => ({
     ...artist,
     source:"Following"
   })
 );
}


/* -------------------------
TOP ARTISTS
------------------------- */

async function getTopArtists(
 token
) {

 const data =
 await spotifyFetch(

   "https://api.spotify.com/v1/me/top/artists?" +

   new URLSearchParams({

     time_range:
     "medium_term",

     limit:"25"

   }),

   token
 );


 return (
   data.items || []
 ).map(
   artist => ({
     ...artist,
     source:"Top Artist"
   })
 );
}


/* -------------------------
FIND SPECIFIC ARTIST
------------------------- */

async function searchArtist(
 name,
 token
) {

 const data =
 await spotifyFetch(

   "https://api.spotify.com/v1/search?" +

   new URLSearchParams({

     q:
     `artist:"${name}"`,

     type:"artist",

     limit:"5"

   }),

   token
 );


 const artists =
 data.artists?.items || [];


 const exact =
 artists.find(
   artist =>
   artist.name.toLowerCase() ===
   name.toLowerCase()
 );


 if(!exact) {
   return null;
 }


 return {
   ...exact,
   source:"Curated"
 };
}


/* -------------------------
ARTIST RELEASES
------------------------- */

async function getArtistReleases(
 artist,
 token
) {

 const url =

 "https://api.spotify.com/v1/artists/" +
 artist.id +
 "/albums?" +

 new URLSearchParams({

   include_groups:
   "album,single",

   market:"US",

   limit:"10"

 });


 const data =
 await spotifyFetch(
   url,
   token
 );


 return (
   data.items || []
 ).map(
   release => ({

     ...release,

     trustedArtist:
     artist.name,

     trustedSource:
     artist.source

   })
 );
}


/* -------------------------
DATE FILTER
------------------------- */

function isRecent(release) {

 if(
   !release.release_date ||
   release.release_date_precision
   !== "day"
 ) {

   return false;
 }


 const now =
 new Date();


 const today =
 new Date(
   now.getFullYear(),
   now.getMonth(),
   now.getDate()
 );


 const cutoff =
 new Date(today);


 if(
   selectedRange ===
   "week"
 ) {

   cutoff.setDate(
     cutoff.getDate()-6
   );
 }


 const date =
 new Date(
   release.release_date +
   "T00:00:00"
 );


 return (
   date >= cutoff &&
   date <= now
 );
}


/* -------------------------
MAIN SEARCH
------------------------- */

async function findNewMusic() {

 const token =
 localStorage.getItem(
   "spotify_access_token"
 );


 if(!token) {

   loginWithSpotify();

   return;
 }


 const status =
 document.getElementById(
   "status"
 );


 document
 .getElementById("results")
 .innerHTML = "";


 try {


   status.innerText =
   "Loading your artists...";


   /*
   Two known-good artists are
   deliberately included as a
   test and as trusted sources.
   */

   const curatedNames = [
     "Silverada",
     "Red Shahan"
   ];


   const followed =
   await getFollowedArtists(
     token
   );


   await sleep(400);


   const top =
   await getTopArtists(
     token
   );


   const curated = [];


   for(
     const name of curatedNames
   ) {

     await sleep(400);

     const artist =
     await searchArtist(
       name,
       token
     );

     if(artist) {
       curated.push(artist);
     }
   }


   /*
   Curated artists first,
   then followed artists,
   then top artists.
   */


   const merged = [
     ...curated,
     ...followed,
     ...top
   ];


   const unique =
   Array.from(

     new Map(

       merged.map(
         artist => [
           artist.id,
           artist
         ]
       )

     ).values()

   );


   /*
   Maximum 50 artists.
   This is deliberate to
   protect our API quota.
   */

   const artists =
   unique.slice(0,50);


   let releases = [];


   for(
     let i=0;
     i<artists.length;
     i++
   ) {

     const artist =
     artists[i];


     status.innerText =
     "Checking " +
     (i+1) +
     " of " +
     artists.length +
     " artists...\n" +
     artist.name;


     const found =
     await getArtistReleases(
       artist,
       token
     );


     releases.push(
       ...found
     );


     /*
     Pace the API calls.
     */

     await sleep(500);
   }


   const uniqueReleases =
   Array.from(

     new Map(

       releases
       .filter(
         r => r?.id
       )
       .map(
         r => [
           r.id,
           r
         ]
       )

     ).values()

   );


   const recent =
   uniqueReleases
   .filter(isRecent)
   .sort(
     (a,b) =>
     b.release_date.localeCompare(
       a.release_date
     )
   );


   displayReleases(
     recent,
     artists.length
   );


 } catch(error) {


   console.error(error);


   if(
     error.message ===
     "QUOTA_EXCEEDED"
   ) {

     status.innerHTML =
     "<b>Spotify Development Mode quota reached.</b><br><br>" +
     "This is Spotify's daily/development API allowance, " +
     "not a problem with the website. Try again after Spotify resets the quota.";

     return;
   }


   if(
     error.message ===
     "RATE_LIMIT"
   ) {

     status.innerText =
     "Spotify is still rate-limiting requests. Wait a little longer and try again.";

     return;
   }


   if(
     error.message ===
     "SESSION_EXPIRED"
   ) {

     localStorage.removeItem(
       "spotify_access_token"
     );

     status.innerText =
     "Spotify session expired. Disconnect and reconnect Spotify.";

     return;
   }


   status.innerText =
   "Something went wrong while checking Spotify.";
 }
}


/* -------------------------
DISPLAY
------------------------- */

function displayReleases(
 releases,
 artistCount
) {

 const results =
 document.getElementById(
   "results"
 );


 const status =
 document.getElementById(
   "status"
 );


 if(releases.length === 0) {

   status.innerHTML =

   selectedRange === "today"

   ? "No releases from your trusted artists were found today."

   : "No releases from your trusted artists were found in the last 7 days.";


   status.innerHTML +=

   `<div class="debug">
   Checked ${artistCount} trusted artists.
   </div>`;


   return;
 }


 status.innerHTML =

 `<b>${releases.length} new releases found</b>

 <div class="debug">
 Checked ${artistCount} trusted artists.
 </div>`;


 releases.forEach(
 release => {


   const div =
   document.createElement(
     "div"
   );


   div.className =
   "release";


   const artists =
   (release.artists || [])
   .map(a=>a.name)
   .join(", ");


   const image =
   release.images?.[1]?.url ||
   release.images?.[0]?.url ||
   "";


   const type =
   release.album_type === "album"
   ? "Album"
   : "Single / EP";


   div.innerHTML = `

   ${
     image
     ?
     `<img
       class="cover"
       src="${image}"
       alt="Album artwork">`
     :
     ""
   }

   <div class="release-info">

     <div class="release-name">
       ${escapeHtml(release.name)}
     </div>

     <div class="artist">
       ${escapeHtml(artists)}
     </div>

     <div class="meta">
       Released:
       ${release.release_date}
       • ${type}
     </div>

     <span class="badge">
       ${escapeHtml(
         release.trustedSource
       )}
     </span>

     <a
       class="spotify-link"
       href="${release.external_urls.spotify}"
       target="_blank"
       rel="noopener noreferrer">
       ▶ Open in Spotify
     </a>

   </div>
   `;


   results.appendChild(
     div
   );
 });
}


/* -------------------------
HTML SAFETY
------------------------- */

function escapeHtml(text) {

 const div =
 document.createElement(
   "div"
 );

 div.textContent =
 text || "";

 return div.innerHTML;
}


/* -------------------------
DISCONNECT
------------------------- */

function logout() {

 localStorage.removeItem(
   "spotify_access_token"
 );

 localStorage.removeItem(
   "code_verifier"
 );

 location.reload();
}


/* START */

handleCallback();

</script>

</body>
</html>
