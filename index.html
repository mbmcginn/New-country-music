<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Country Music Finder</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 720px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-top: 25px;
    }

    .subtitle {
      text-align: center;
      color: #b3b3b3;
      line-height: 1.45;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .filter-btn {
      flex: 1;
      padding: 12px;
      border-radius: 22px;
      border: 1px solid #555;
      background: #242424;
      color: white;
      font-weight: bold;
    }

    .filter-btn.active {
      background: #1DB954;
      color: black;
      border-color: #1DB954;
    }

    button.main,
    button.secondary {
      display: block;
      width: 100%;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
    }

    button.main {
      background: #1DB954;
      color: black;
      padding: 16px;
      font-size: 18px;
      margin: 20px 0;
    }

    button.secondary {
      background: #333;
      color: white;
      padding: 14px;
      font-size: 16px;
      margin-bottom: 14px;
    }

    .status {
      text-align: center;
      color: #b3b3b3;
      margin: 20px 0;
      line-height: 1.5;
    }

    .release {
      background: #242424;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .cover {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .release-info {
      flex: 1;
      min-width: 0;
    }

    .release-name {
      font-size: 17px;
      font-weight: bold;
    }

    .artist {
      color: #b3b3b3;
      margin-top: 4px;
    }

    .meta {
      color: #999;
      font-size: 13px;
      margin-top: 5px;
    }

    .badge {
      display: inline-block;
      background: #174f2a;
      color: #b7f7c9;
      border-radius: 12px;
      padding: 3px 8px;
      font-size: 11px;
      margin-top: 6px;
      margin-right: 5px;
    }

    .spotify-link {
      display: block;
      margin-top: 9px;
      color: #1DB954;
      text-decoration: none;
      font-weight: bold;
    }

    .debug {
      font-size: 12px;
      color: #777;
      margin-top: 8px;
    }

    .artist-box {
      background: #1f1f1f;
      border-radius: 12px;
      padding: 14px;
      margin-top: 18px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      box-sizing: border-box;
      background: #181818;
      color: white;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎵 New Country Music Finder</h1>

  <p class="subtitle">
    New releases from trusted country, Red Dirt, Americana,
    and related artists.
  </p>

  <button
    id="loginButton"
    class="main"
    onclick="loginWithSpotify()"
  >
    Connect Spotify
  </button>

  <div id="controls" style="display:none;">

    <div class="filters">

      <button
        id="todayButton"
        class="filter-btn active"
        onclick="setRange('today')"
      >
        Today
      </button>

      <button
        id="weekButton"
        class="filter-btn"
        onclick="setRange('week')"
      >
        Last 7 Days
      </button>

    </div>

    <button
      class="main"
      onclick="findNewMusic(false)"
    >
      Find New Music
    </button>

    <button
      class="secondary"
      onclick="findNewMusic(true)"
    >
      Force Refresh Spotify
    </button>

    <button
      class="secondary"
      onclick="toggleArtistEditor()"
    >
      Edit Trusted Artists
    </button>

    <div
      id="artistEditor"
      class="artist-box"
      style="display:none;"
    >
      <p>
        One artist per line:
      </p>

      <textarea id="artistList"></textarea>

      <button
        class="main"
        onclick="saveTrustedArtists()"
      >
        Save Trusted Artists
      </button>
    </div>

    <button
      class="secondary"
      onclick="logout()"
    >
      Disconnect Spotify
    </button>

  </div>

  <div id="status" class="status">
    Connect Spotify to begin.
  </div>

  <div id="results"></div>

</div>

<script>

const clientId =
  "ec35e5f54f2946e18aa9086b4a89fd17";

const redirectUri =
  "https://mbmcginn.github.io/New-country-music/";

const CACHE_HOURS = 24;

const MAX_ARTISTS_PER_REFRESH = 20;

let selectedRange = "today";


const defaultTrustedArtists = [

  "Silverada",
  "Red Shahan",
  "Turnpike Troubadours",
  "Shane Smith & the Saints",
  "Cody Jinks",
  "Tyler Childers",
  "Sturgill Simpson",
  "Jason Isbell",
  "Whiskey Myers",
  "Charles Wesley Godwin",
  "49 Winchester",
  "Flatland Cavalry",
  "Mike and the Moonpies",
  "American Aquarium",
  "Parker McCollum",
  "Kaitlin Butts",
  "Zach Bryan",
  "Ryan Bingham",
  "Reckless Kelly",
  "Micky and the Motorcars"

];


/* -------------------------
   RANGE
------------------------- */

function setRange(range) {

  selectedRange = range;

  document
    .getElementById("todayButton")
    .classList.toggle(
      "active",
      range === "today"
    );

  document
    .getElementById("weekButton")
    .classList.toggle(
      "active",
      range === "week"
    );

  showCachedResultsOnly();
}


/* -------------------------
   TRUSTED ARTISTS
------------------------- */

function getTrustedArtists() {

  const saved =
    localStorage.getItem(
      "trusted_artists"
    );

  if (!saved) {
    return defaultTrustedArtists;
  }

  try {

    const parsed =
      JSON.parse(saved);

    if (
      Array.isArray(parsed) &&
      parsed.length > 0
    ) {
      return parsed;
    }

  } catch (e) {}

  return defaultTrustedArtists;
}


function toggleArtistEditor() {

  const editor =
    document.getElementById(
      "artistEditor"
    );

  editor.style.display =
    editor.style.display === "none"
      ? "block"
      : "none";

  document.getElementById(
    "artistList"
  ).value =
    getTrustedArtists().join("\n");
}


function saveTrustedArtists() {

  const raw =
    document.getElementById(
      "artistList"
    ).value;

  const artists =
    raw
      .split("\n")
      .map(x => x.trim())
      .filter(Boolean);

  localStorage.setItem(
    "trusted_artists",
    JSON.stringify(artists)
  );

  document.getElementById(
    "status"
  ).innerText =
    "Trusted artist list saved.";

  document.getElementById(
    "artistEditor"
  ).style.display =
    "none";
}


/* -------------------------
   LOGIN
------------------------- */

function randomString(length) {

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for (let i = 0; i < length; i++) {

    result += chars.charAt(
      Math.floor(
        Math.random() *
        chars.length
      )
    );
  }

  return result;
}


async function sha256(text) {

  return crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(text)
  );
}


function base64url(buffer) {

  return btoa(
    String.fromCharCode(
      ...new Uint8Array(buffer)
    )
  )
  .replace(/=/g, "")
  .replace(/\+/g, "-")
  .replace(/\//g, "_");
}


async function loginWithSpotify() {

  const verifier =
    randomString(64);

  localStorage.setItem(
    "code_verifier",
    verifier
  );

  const challenge =
    base64url(
      await sha256(verifier)
    );

  const url =
    new URL(
      "https://accounts.spotify.com/authorize"
    );

  url.search =
    new URLSearchParams({

      client_id:
        clientId,

      response_type:
        "code",

      redirect_uri:
        redirectUri,

      scope:
        "user-follow-read user-top-read",

      code_challenge_method:
        "S256",

      code_challenge:
        challenge

    }).toString();

  location.href =
    url.toString();
}


/* -------------------------
   TOKEN
------------------------- */

async function getToken(code) {

  const verifier =
    localStorage.getItem(
      "code_verifier"
    );

  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {

        method:
          "POST",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body:
          new URLSearchParams({

            client_id:
              clientId,

            grant_type:
              "authorization_code",

            code:
              code,

            redirect_uri:
              redirectUri,

            code_verifier:
              verifier

          })
      }
    );

  const data =
    await response.json();

  if (
    data.access_token
  ) {

    localStorage.setItem(
      "spotify_access_token",
      data.access_token
    );
  }

  return data;
}


/* -------------------------
   CALLBACK
------------------------- */

async function handleCallback() {

  const params =
    new URLSearchParams(
      location.search
    );

  const code =
    params.get("code");

  if (code) {

    document
      .getElementById("status")
      .innerText =
        "Connecting to Spotify...";

    const token =
      await getToken(code);

    history.replaceState(
      {},
      document.title,
      redirectUri
    );

    if (
      token.access_token
    ) {

      showConnected();

    } else {

      document
        .getElementById("status")
        .innerText =
          "Spotify connection failed.";
    }

  } else {

    if (
      localStorage.getItem(
        "spotify_access_token"
      )
    ) {

      showConnected();
    }
  }
}


function showConnected() {

  document
    .getElementById("loginButton")
    .style.display =
      "none";

  document
    .getElementById("controls")
    .style.display =
      "block";

  document
    .getElementById("status")
    .innerText =
      "Spotify connected.";

  showCachedResultsOnly();
}


/* -------------------------
   SPOTIFY FETCH
------------------------- */

async function spotifyFetch(
  url,
  token
) {

  const response =
    await fetch(
      url,
      {
        headers: {
          Authorization:
            "Bearer " + token
        }
      }
    );

  if (
    response.status === 401
  ) {
    throw new Error(
      "SESSION_EXPIRED"
    );
  }

  if (
    response.status === 429
  ) {

    let body = {};

    try {
      body =
        await response.json();
    } catch (e) {}

    if (
      body?.error?.reason ===
        "QUOTA_EXCEEDED" ||
      body?.reason ===
        "QUOTA_EXCEEDED"
    ) {

      throw new Error(
        "QUOTA_EXCEEDED"
      );
    }

    throw new Error(
      "RATE_LIMIT"
    );
  }

  if (
    !response.ok
  ) {

    throw new Error(
      "SPOTIFY_ERROR"
    );
  }

  return response.json();
}


/* -------------------------
   CACHE HELPERS
------------------------- */

function getCache() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "release_cache"
      )
    ) || {};

  } catch (e) {

    return {};
  }
}


function saveCache(cache) {

  localStorage.setItem(
    "release_cache",
    JSON.stringify(cache)
  );
}


function cacheIsFresh(
  cached
) {

  if (
    !cached ||
    !cached.checkedAt
  ) {
    return false;
  }

  const age =
    Date.now() -
    cached.checkedAt;

  return age <
    CACHE_HOURS *
    60 *
    60 *
    1000;
}


/* -------------------------
   ARTIST LOOKUP
------------------------- */

async function findArtistByName(
  name,
  token
) {

  const data =
    await spotifyFetch(

      "https://api.spotify.com/v1/search?" +

      new URLSearchParams({

        q:
          `artist:"${name}"`,

        type:
          "artist",

        limit:
          "5"

      }),

      token
    );

  const items =
    data.artists?.items || [];

  const exact =
    items.find(
      artist =>
        artist.name
          .toLowerCase() ===
        name.toLowerCase()
    );

  return exact || null;
}


/* -------------------------
   ARTIST RELEASES
------------------------- */

async function getArtistReleases(
  artist,
  token
) {

  const data =
    await spotifyFetch(

      "https://api.spotify.com/v1/artists/" +
      artist.id +
      "/albums?" +

      new URLSearchParams({

        include_groups:
          "album,single",

        market:
          "US",

        limit:
          "10"

      }),

      token
    );

  return (
    data.items || []
  ).map(
    release => ({
      ...release,
      trustedArtist:
        artist.name
    })
  );
}


/* -------------------------
   DATE FILTER
------------------------- */

function isRecent(
  release
) {

  if (
    !release.release_date ||
    release.release_date_precision !==
      "day"
  ) {
    return false;
  }

  const now =
    new Date();

  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const cutoff =
    new Date(today);

  if (
    selectedRange ===
    "week"
  ) {

    cutoff.setDate(
      cutoff.getDate() - 6
    );
  }

  const releaseDate =
    new Date(
      release.release_date +
      "T00:00:00"
    );

  return (
    releaseDate >= cutoff &&
    releaseDate <= now
  );
}


/* -------------------------
   MAIN SEARCH
------------------------- */

async function findNewMusic(
  forceRefresh
) {

  const token =
    localStorage.getItem(
      "spotify_access_token"
    );

  if (!token) {

    loginWithSpotify();
    return;
  }

  const status =
    document.getElementById(
      "status"
    );

  const artists =
    getTrustedArtists();

  const cache =
    getCache();

  let checked = 0;

  let usedCache = 0;

  let apiCallsNeeded = 0;


  for (
    const name of artists
  ) {

    const cached =
      cache[name];

    if (
      !forceRefresh &&
      cacheIsFresh(cached)
    ) {

      usedCache++;

    } else {

      apiCallsNeeded++;
    }
  }


  if (
    apiCallsNeeded >
    MAX_ARTISTS_PER_REFRESH
  ) {

    status.innerHTML =
      `To protect your Spotify quota, this refresh will check only
      ${MAX_ARTISTS_PER_REFRESH} stale artists.<br><br>
      The rest will stay cached until a later refresh.`;
  }


  try {

    let refreshCount = 0;

    for (
      const name of artists
    ) {

      const cached =
        cache[name];

      if (
        !forceRefresh &&
        cacheIsFresh(cached)
      ) {
        continue;
      }

      if (
        refreshCount >=
        MAX_ARTISTS_PER_REFRESH
      ) {
        break;
      }

      status.innerText =
        "Checking Spotify...\n" +
        name;

      const artist =
        await findArtistByName(
          name,
          token
        );

      if (!artist) {

        cache[name] = {
          checkedAt:
            Date.now(),
          releases:
            []
        };

        refreshCount++;
        continue;
      }

      const releases =
        await getArtistReleases(
          artist,
          token
        );

      cache[name] = {
        checkedAt:
          Date.now(),
        artistId:
          artist.id,
        artistName:
          artist.name,
        releases:
          releases
      };

      saveCache(
        cache
      );

      refreshCount++;

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            500
          )
      );
    }

    saveCache(
      cache
    );

    showCachedResultsOnly();

  } catch (error) {

    if (
      error.message ===
      "QUOTA_EXCEEDED"
    ) {

      status.innerHTML =
        "<b>Spotify quota reached.</b><br><br>" +
        "Your existing cached results are still available.";

      showCachedResultsOnly();

      return;
    }

    if (
      error.message ===
      "RATE_LIMIT"
    ) {

      status.innerHTML =
        "Spotify asked us to slow down.<br><br>" +
        "Your cached results are still available.";

      showCachedResultsOnly();

      return;
    }

    if (
      error.message ===
      "SESSION_EXPIRED"
    ) {

      localStorage.removeItem(
        "spotify_access_token"
      );

      status.innerText =
        "Spotify session expired. Reconnect Spotify.";

      return;
    }

    status.innerText =
      "Something went wrong while checking Spotify.";
  }
}


/* -------------------------
   DISPLAY FROM CACHE
------------------------- */

function showCachedResultsOnly() {

  const cache =
    getCache();

  let releases = [];

  let cachedArtists = 0;


  Object.values(
    cache
  ).forEach(
    entry => {

      if (
        entry &&
        Array.isArray(
          entry.releases
        )
      ) {

        cachedArtists++;

        releases.push(
          ...entry.releases
        );
      }
    }
  );


  const unique =
    Array.from(
      new Map(
        releases
          .filter(
            release =>
              release?.id
          )
          .map(
            release => [
              release.id,
              release
            ]
          )
      ).values()
    );


  const recent =
    unique
      .filter(
        isRecent
      )
      .sort(
        (a, b) =>
          b.release_date
            .localeCompare(
              a.release_date
            )
      );


  displayReleases(
    recent,
    cachedArtists
  );
}


/* -------------------------
   DISPLAY
------------------------- */

function displayReleases(
  releases,
  cachedArtists
) {

  const results =
    document.getElementById(
      "results"
    );

  const status =
    document.getElementById(
      "status"
    );

  results.innerHTML = "";


  if (
    releases.length === 0
  ) {

    status.innerHTML =

      selectedRange ===
      "today"

      ? "No cached trusted releases found today."

      : "No cached trusted releases found in the last 7 days.";


    status.innerHTML +=

      `<div class="debug">
        ${cachedArtists}
        artists currently cached.
      </div>`;

    return;
  }


  status.innerHTML =

    `<b>${releases.length} trusted new releases found</b>

    <div class="debug">
      ${cachedArtists}
      artists currently cached.
    </div>`;


  releases.forEach(
    release => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "release";


      const artists =
        (release.artists || [])
          .map(
            a => a.name
          )
          .join(", ");


      const image =
        release.images?.[1]?.url ||
        release.images?.[0]?.url ||
        "";


      const type =
        release.album_type ===
        "album"
          ? "Album"
          : "Single / EP";


      div.innerHTML = `

        ${
          image
            ? `<img
                class="cover"
                src="${image}"
                alt="Album artwork"
              >`
            : ""
        }

        <div class="release-info">

          <div class="release-name">
            ${escapeHtml(
              release.name
            )}
          </div>

          <div class="artist">
            ${escapeHtml(
              artists
            )}
          </div>

          <div class="meta">
            Released:
            ${release.release_date}
            • ${type}
          </div>

          <span class="badge">
            Trusted Artist
          </span>

          <a
            class="spotify-link"
            href="${release.external_urls.spotify}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ▶ Open in Spotify
          </a>

        </div>
      `;


      results.appendChild(
        div
      );
    }
  );
}


/* -------------------------
   SAFETY
------------------------- */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text || "";

  return div.innerHTML;
}


/* -------------------------
   LOGOUT
------------------------- */

function logout() {

  localStorage.removeItem(
    "spotify_access_token"
  );

  localStorage.removeItem(
    "code_verifier"
  );

  location.reload();
}


/* START */

handleCallback();

</script>

</body>
</html>
