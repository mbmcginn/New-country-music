<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Country Music Finder</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-top: 30px;
    }

    .subtitle {
      text-align: center;
      color: #b3b3b3;
    }

    button {
      display: block;
      width: 100%;
      background: #1DB954;
      color: black;
      border: none;
      padding: 16px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      margin: 20px 0;
      cursor: pointer;
    }

    .secondary {
      background: #333;
      color: white;
    }

    .status {
      text-align: center;
      color: #b3b3b3;
      margin: 20px 0;
    }

    .track {
      background: #242424;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .track-name {
      font-size: 18px;
      font-weight: bold;
    }

    .artist {
      color: #b3b3b3;
      margin-top: 4px;
    }

    .release-date {
      color: #999;
      font-size: 14px;
      margin-top: 5px;
    }

    .spotify-link {
      display: inline-block;
      margin-top: 10px;
      color: #1DB954;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎵 New Country Music Finder</h1>

  <p class="subtitle">
    Find newly released country music on Spotify
  </p>

  <button id="loginButton" onclick="loginWithSpotify()">
    Connect Spotify
  </button>

  <button
    id="searchButton"
    onclick="findNewMusic()"
    style="display:none;"
  >
    Find New Music
  </button>

  <button
    id="logoutButton"
    class="secondary"
    onclick="logout()"
    style="display:none;"
  >
    Disconnect Spotify
  </button>

  <div id="status" class="status">
    Connect Spotify to begin.
  </div>

  <div id="results"></div>

</div>


<script>

const clientId = "ec35e5f54f2946e18aa9086b4a89fd17";

const redirectUri =
  "https://mbmcginn.github.io/New-country-music/";


/* -------------------------------------------------
   PKCE AUTHENTICATION
-------------------------------------------------- */

function generateRandomString(length) {

  const possible =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let text = "";

  for (let i = 0; i < length; i++) {

    text += possible.charAt(
      Math.floor(Math.random() * possible.length)
    );

  }

  return text;

}


async function sha256(plain) {

  const encoder = new TextEncoder();

  const data = encoder.encode(plain);

  return window.crypto.subtle.digest("SHA-256", data);

}


function base64encode(input) {

  return btoa(
    String.fromCharCode(...new Uint8Array(input))
  )
  .replace(/=/g, "")
  .replace(/\+/g, "-")
  .replace(/\//g, "_");

}


async function loginWithSpotify() {

  const codeVerifier = generateRandomString(64);

  localStorage.setItem(
    "code_verifier",
    codeVerifier
  );

  const hashed =
    await sha256(codeVerifier);

  const codeChallenge =
    base64encode(hashed);


  const authUrl =
    new URL(
      "https://accounts.spotify.com/authorize"
    );


  const params = {

    client_id: clientId,

    response_type: "code",

    redirect_uri: redirectUri,

    code_challenge_method: "S256",

    code_challenge: codeChallenge

  };


  authUrl.search =
    new URLSearchParams(params).toString();


  window.location.href =
    authUrl.toString();

}


/* -------------------------------------------------
   GET ACCESS TOKEN
-------------------------------------------------- */

async function getToken(code) {

  const codeVerifier =
    localStorage.getItem(
      "code_verifier"
    );


  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {

        method: "POST",

        headers: {

          "Content-Type":
            "application/x-www-form-urlencoded"

        },

        body:
          new URLSearchParams({

            client_id: clientId,

            grant_type:
              "authorization_code",

            code: code,

            redirect_uri:
              redirectUri,

            code_verifier:
              codeVerifier

          })

      }
    );


  const data =
    await response.json();


  if (data.access_token) {

    localStorage.setItem(
      "spotify_access_token",
      data.access_token
    );

  }


  return data;

}


/* -------------------------------------------------
   HANDLE RETURN FROM SPOTIFY
-------------------------------------------------- */

async function handleSpotifyCallback() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const code =
    params.get("code");


  if (code) {

    document.getElementById(
      "status"
    ).innerText =
      "Connecting to Spotify...";


    const tokenData =
      await getToken(code);


    window.history.replaceState(
      {},
      document.title,
      redirectUri
    );


    if (tokenData.access_token) {

      showConnected();

    } else {

      document.getElementById(
        "status"
      ).innerText =
        "Spotify connection failed.";

    }

  } else {

    const token =
      localStorage.getItem(
        "spotify_access_token"
      );


    if (token) {

      showConnected();

    }

  }

}


/* -------------------------------------------------
   CONNECTED DISPLAY
-------------------------------------------------- */

function showConnected() {

  document.getElementById(
    "loginButton"
  ).style.display =
    "none";


  document.getElementById(
    "searchButton"
  ).style.display =
    "block";


  document.getElementById(
    "logoutButton"
  ).style.display =
    "block";


  document.getElementById(
    "status"
  ).innerText =
    "Spotify connected.";

}


/* -------------------------------------------------
   SEARCH SPOTIFY
-------------------------------------------------- */

async function findNewMusic() {

  const token =
    localStorage.getItem(
      "spotify_access_token"
    );


  if (!token) {

    loginWithSpotify();

    return;

  }


  document.getElementById(
    "status"
  ).innerText =
    "Searching Spotify...";


  document.getElementById(
    "results"
  ).innerHTML =
    "";


  const today =
    new Date();


  const sevenDaysAgo =
    new Date();


  sevenDaysAgo.setDate(
    today.getDate() - 7
  );


  const searches = [

    "genre:country",

    "country",

    "americana",

    "country rock",

    "red dirt",

    "alt country"

  ];


  let tracks = [];


  for (const query of searches) {

    const url =
      "https://api.spotify.com/v1/search?" +

      new URLSearchParams({

        q: query,

        type: "track",

        market: "US",

        limit: "10"

      });


    const response =
      await fetch(
        url,
        {

          headers: {

            Authorization:
              "Bearer " + token

          }

        }
      );


    if (response.status === 401) {

      localStorage.removeItem(
        "spotify_access_token"
      );

      document.getElementById(
        "status"
      ).innerText =
        "Spotify session expired. Connect again.";

      document.getElementById(
        "loginButton"
      ).style.display =
        "block";

      document.getElementById(
        "searchButton"
      ).style.display =
        "none";

      return;

    }


    const data =
      await response.json();


    if (
      data.tracks &&
      data.tracks.items
    ) {

      tracks =
        tracks.concat(
          data.tracks.items
        );

    }

  }


  /* Remove duplicates */

  const uniqueTracks =
    Array.from(

      new Map(

        tracks.map(
          track =>
            [track.id, track]
        )

      ).values()

    );


  /* Filter to last 7 days */

  const recentTracks =
    uniqueTracks.filter(
      track => {

        const releaseDate =
          new Date(
            track.album.release_date
          );

        return (
          releaseDate >= sevenDaysAgo &&
          releaseDate <= today
        );

      }
    );


  /* Sort newest first */

  recentTracks.sort(
    (a, b) =>

      new Date(
        b.album.release_date
      ) -

      new Date(
        a.album.release_date
      )

  );


  displayTracks(
    recentTracks
  );

}


/* -------------------------------------------------
   DISPLAY RESULTS
-------------------------------------------------- */

function displayTracks(tracks) {

  const results =
    document.getElementById(
      "results"
    );


  if (tracks.length === 0) {

    document.getElementById(
      "status"
    ).innerText =
      "No new tracks found.";

    return;

  }


  document.getElementById(
    "status"
  ).innerText =
    tracks.length +
    " new tracks found";


  tracks.forEach(
    track => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "track";


      const artists =
        track.artists
          .map(
            artist =>
              artist.name
          )
          .join(", ");


      div.innerHTML = `

        <div class="track-name">
          ${track.name}
        </div>

        <div class="artist">
          ${artists}
        </div>

        <div class="release-date">
          Released:
          ${track.album.release_date}
        </div>

        <a
          class="spotify-link"
          href="${track.external_urls.spotify}"
          target="_blank"
        >
          ▶ Open in Spotify
        </a>

      `;


      results.appendChild(div);

    }
  );

}


/* -------------------------------------------------
   LOGOUT
-------------------------------------------------- */

function logout() {

  localStorage.removeItem(
    "spotify_access_token"
  );


  localStorage.removeItem(
    "code_verifier"
  );


  location.reload();

}


/* Start */

handleSpotifyCallback();

</script>

</body>
</html>
