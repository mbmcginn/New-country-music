<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Country Music Finder</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 720px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-top: 25px;
    }

    .subtitle {
      text-align: center;
      color: #b3b3b3;
      line-height: 1.4;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .filter-btn {
      flex: 1;
      padding: 12px;
      border-radius: 22px;
      border: 1px solid #555;
      background: #242424;
      color: white;
      font-weight: bold;
    }

    .filter-btn.active {
      background: #1DB954;
      color: black;
      border-color: #1DB954;
    }

    button.main,
    button.secondary {
      display: block;
      width: 100%;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
    }

    button.main {
      background: #1DB954;
      color: black;
      padding: 16px;
      font-size: 18px;
      margin: 20px 0;
    }

    button.secondary {
      background: #333;
      color: white;
      padding: 14px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .status {
      text-align: center;
      color: #b3b3b3;
      margin: 20px 0;
      line-height: 1.5;
    }

    .section-title {
      margin-top: 28px;
      margin-bottom: 12px;
      font-size: 20px;
      font-weight: bold;
    }

    .release {
      background: #242424;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .cover {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .release-info {
      flex: 1;
      min-width: 0;
    }

    .release-name {
      font-size: 17px;
      font-weight: bold;
    }

    .artist {
      color: #b3b3b3;
      margin-top: 4px;
    }

    .meta {
      color: #999;
      font-size: 13px;
      margin-top: 5px;
    }

    .badge {
      display: inline-block;
      background: #333;
      color: #ddd;
      border-radius: 12px;
      padding: 3px 8px;
      font-size: 11px;
      margin-top: 6px;
      margin-right: 4px;
    }

    .trusted {
      background: #174f2a;
      color: #b7f7c9;
    }

    .spotify-link {
      display: inline-block;
      margin-top: 9px;
      color: #1DB954;
      text-decoration: none;
      font-weight: bold;
    }

    .debug {
      font-size: 12px;
      color: #777;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎵 New Country Music Finder</h1>

  <p class="subtitle">
    New releases from artists you already follow or listen to on Spotify.
  </p>

  <button
    id="loginButton"
    class="main"
    onclick="loginWithSpotify()"
  >
    Connect Spotify
  </button>

  <div id="controls" style="display:none;">

    <div class="filters">

      <button
        id="todayButton"
        class="filter-btn active"
        onclick="setRange('today')"
      >
        Today
      </button>

      <button
        id="weekButton"
        class="filter-btn"
        onclick="setRange('week')"
      >
        Last 7 Days
      </button>

    </div>

    <button
      class="main"
      onclick="findNewMusic()"
    >
      Find New Music
    </button>

    <button
      class="secondary"
      onclick="logout()"
    >
      Disconnect Spotify
    </button>

  </div>

  <div id="status" class="status">
    Connect Spotify to begin.
  </div>

  <div id="results"></div>

</div>

<script>

const clientId =
  "ec35e5f54f2946e18aa9086b4a89fd17";

const redirectUri =
  "https://mbmcginn.github.io/New-country-music/";

let selectedRange = "today";


/* -------------------------
   RANGE
------------------------- */

function setRange(range) {

  selectedRange = range;

  document
    .getElementById("todayButton")
    .classList.toggle(
      "active",
      range === "today"
    );

  document
    .getElementById("weekButton")
    .classList.toggle(
      "active",
      range === "week"
    );
}


/* -------------------------
   PKCE LOGIN
------------------------- */

function generateRandomString(length) {

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for (let i = 0; i < length; i++) {

    result += chars.charAt(
      Math.floor(
        Math.random() * chars.length
      )
    );
  }

  return result;
}


async function sha256(plain) {

  const encoder =
    new TextEncoder();

  return window.crypto.subtle.digest(
    "SHA-256",
    encoder.encode(plain)
  );
}


function base64encode(input) {

  return btoa(
    String.fromCharCode(
      ...new Uint8Array(input)
    )
  )
  .replace(/=/g, "")
  .replace(/\+/g, "-")
  .replace(/\//g, "_");
}


async function loginWithSpotify() {

  const verifier =
    generateRandomString(64);

  localStorage.setItem(
    "code_verifier",
    verifier
  );

  const challenge =
    base64encode(
      await sha256(verifier)
    );

  const authUrl =
    new URL(
      "https://accounts.spotify.com/authorize"
    );

  authUrl.search =
    new URLSearchParams({

      client_id: clientId,

      response_type: "code",

      redirect_uri: redirectUri,

      scope:
        "user-follow-read user-top-read",

      code_challenge_method:
        "S256",

      code_challenge:
        challenge

    }).toString();

  window.location.href =
    authUrl.toString();
}


/* -------------------------
   TOKEN
------------------------- */

async function getToken(code) {

  const verifier =
    localStorage.getItem(
      "code_verifier"
    );

  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body:
          new URLSearchParams({

            client_id: clientId,

            grant_type:
              "authorization_code",

            code: code,

            redirect_uri:
              redirectUri,

            code_verifier:
              verifier

          })
      }
    );

  const data =
    await response.json();

  if (data.access_token) {

    localStorage.setItem(
      "spotify_access_token",
      data.access_token
    );
  }

  return data;
}


/* -------------------------
   CALLBACK
------------------------- */

async function handleSpotifyCallback() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const code =
    params.get("code");

  if (code) {

    document.getElementById(
      "status"
    ).innerText =
      "Connecting to Spotify...";

    const tokenData =
      await getToken(code);

    window.history.replaceState(
      {},
      document.title,
      redirectUri
    );

    if (tokenData.access_token) {

      showConnected();

    } else {

      document.getElementById(
        "status"
      ).innerText =
        "Spotify connection failed.";
    }

  } else {

    const token =
      localStorage.getItem(
        "spotify_access_token"
      );

    if (token) {
      showConnected();
    }
  }
}


function showConnected() {

  document.getElementById(
    "loginButton"
  ).style.display =
    "none";

  document.getElementById(
    "controls"
  ).style.display =
    "block";

  document.getElementById(
    "status"
  ).innerText =
    "Spotify connected.";
}


/* -------------------------
   API HELPERS
------------------------- */

async function spotifyFetch(
  url,
  token
) {

  const response =
    await fetch(
      url,
      {
        headers: {
          Authorization:
            "Bearer " + token
        }
      }
    );

  if (response.status === 401) {
    throw new Error("SESSION_EXPIRED");
  }

  if (response.status === 429) {
    throw new Error("RATE_LIMIT");
  }

  if (!response.ok) {

    const text =
      await response.text();

    console.error(
      response.status,
      text
    );

    throw new Error(
      "SPOTIFY_ERROR"
    );
  }

  return response.json();
}


/* -------------------------
   FOLLOWED ARTISTS
------------------------- */

async function getFollowedArtists(
  token
) {

  let artists = [];

  let url =
    "https://api.spotify.com/v1/me/following?type=artist&limit=50";

  while (url) {

    const data =
      await spotifyFetch(
        url,
        token
      );

    const items =
      data.artists?.items || [];

    artists.push(
      ...items.map(
        artist => ({
          ...artist,
          source: "Following"
        })
      )
    );

    url =
      data.artists?.next || null;
  }

  return artists;
}


/* -------------------------
   TOP ARTISTS
------------------------- */

async function getTopArtists(
  token
) {

  const ranges = [
    "short_term",
    "medium_term",
    "long_term"
  ];

  let artists = [];

  for (
    const timeRange of ranges
  ) {

    const data =
      await spotifyFetch(

        "https://api.spotify.com/v1/me/top/artists?" +

        new URLSearchParams({

          time_range:
            timeRange,

          limit:
            "50"

        }),

        token
      );

    artists.push(
      ...(data.items || [])
        .map(
          artist => ({
            ...artist,
            source: "Top Artist"
          })
        )
    );
  }

  return artists;
}


/* -------------------------
   ARTIST RELEASES
------------------------- */

async function getArtistReleases(
  artist,
  token
) {

  let releases = [];

  let offset = 0;

  while (offset < 50) {

    const url =
      "https://api.spotify.com/v1/artists/" +
      artist.id +
      "/albums?" +

      new URLSearchParams({

        include_groups:
          "album,single",

        market:
          "US",

        limit:
          "10",

        offset:
          offset.toString()

      });


    const data =
      await spotifyFetch(
        url,
        token
      );


    const items =
      data.items || [];


    releases.push(
      ...items.map(
        release => ({
          ...release,
          trustedArtist:
            artist.name,

          trustedSource:
            artist.source
        })
      )
    );


    if (
      items.length < 10
    ) {
      break;
    }


    offset += 10;
  }


  return releases;
}


/* -------------------------
   DATE FILTER
------------------------- */

function releaseIsRecent(
  release
) {

  if (
    !release.release_date ||
    release.release_date_precision
      !== "day"
  ) {
    return false;
  }


  const now =
    new Date();


  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );


  let cutoff =
    new Date(today);


  if (
    selectedRange ===
    "week"
  ) {

    cutoff.setDate(
      cutoff.getDate() - 6
    );
  }


  const releaseDate =
    new Date(
      release.release_date +
      "T00:00:00"
    );


  return (
    releaseDate >= cutoff &&
    releaseDate <= now
  );
}


/* -------------------------
   FIND MUSIC
------------------------- */

async function findNewMusic() {

  const token =
    localStorage.getItem(
      "spotify_access_token"
    );


  if (!token) {

    loginWithSpotify();

    return;
  }


  const status =
    document.getElementById(
      "status"
    );


  const results =
    document.getElementById(
      "results"
    );


  results.innerHTML = "";


  try {

    status.innerText =
      "Loading artists you trust...";


    const [
      followedArtists,
      topArtists
    ] =
      await Promise.all([

        getFollowedArtists(
          token
        ),

        getTopArtists(
          token
        )

      ]);


    const mergedArtists =
      [
        ...followedArtists,
        ...topArtists
      ];


    const uniqueArtists =
      Array.from(
        new Map(
          mergedArtists.map(
            artist => [
              artist.id,
              artist
            ]
          )
        ).values()
      );


    status.innerText =
      "Checking " +
      uniqueArtists.length +
      " artists for new releases...";


    let allReleases = [];


    for (
      let i = 0;
      i < uniqueArtists.length;
      i++
    ) {

      const artist =
        uniqueArtists[i];


      status.innerText =
        "Checking artists... " +
        (i + 1) +
        " of " +
        uniqueArtists.length +
        "\n" +
        artist.name;


      const releases =
        await getArtistReleases(
          artist,
          token
        );


      allReleases.push(
        ...releases
      );
    }


    const uniqueReleases =
      Array.from(
        new Map(
          allReleases
            .filter(
              release =>
                release?.id
            )
            .map(
              release => [
                release.id,
                release
              ]
            )
        ).values()
      );


    const recent =
      uniqueReleases
        .filter(
          releaseIsRecent
        )
        .sort(
          (a, b) =>

            b.release_date
              .localeCompare(
                a.release_date
              )
        );


    displayReleases(
      recent,
      followedArtists.length,
      uniqueArtists.length
    );


  } catch (error) {


    if (
      error.message ===
      "SESSION_EXPIRED"
    ) {

      localStorage.removeItem(
        "spotify_access_token"
      );

      status.innerText =
        "Spotify session expired. Reconnect Spotify.";

      document.getElementById(
        "loginButton"
      ).style.display =
        "block";

      document.getElementById(
        "controls"
      ).style.display =
        "none";

      return;
    }


    if (
      error.message ===
      "RATE_LIMIT"
    ) {

      status.innerText =
        "Spotify temporarily rate-limited the search. Wait a minute and try again.";

      return;
    }


    console.error(error);


    status.innerText =
      "Something went wrong while checking your artists.";
  }
}


/* -------------------------
   DISPLAY
------------------------- */

function displayReleases(
  releases,
  followedCount,
  trustedCount
) {

  const results =
    document.getElementById(
      "results"
    );


  const status =
    document.getElementById(
      "status"
    );


  if (
    releases.length === 0
  ) {

    status.innerHTML =

      selectedRange === "today"

      ? "No new releases from your trusted artists were found today."

      : "No new releases from your trusted artists were found in the last 7 days.";


    status.innerHTML +=
      `<div class="debug">
        Checked ${trustedCount} trusted artists,
        including ${followedCount} followed artists.
      </div>`;

    return;
  }


  status.innerHTML =
    `${releases.length} trusted new releases found

    <div class="debug">
      Checked ${trustedCount} trusted artists,
      including ${followedCount} followed artists.
    </div>`;


  releases.forEach(
    release => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "release";


      const artists =
        (release.artists || [])
          .map(
            artist =>
              artist.name
          )
          .join(", ");


      const image =
        release.images?.[1]?.url ||
        release.images?.[0]?.url ||
        "";


      const spotifyUrl =
        release.external_urls?.spotify ||
        "#";


      const typeLabel =
        release.album_type === "single"
        ? "Single / EP"
        : "Album";


      div.innerHTML = `

        ${
          image
          ?
          `<img
            class="cover"
            src="${image}"
            alt="Spotify artwork"
          >`
          :
          ""
        }

        <div class="release-info">

          <div class="release-name">
            ${escapeHtml(release.name)}
          </div>

          <div class="artist">
            ${escapeHtml(artists)}
          </div>

          <div class="meta">
            Released:
            ${release.release_date}
          </div>

          <span class="badge">
            ${typeLabel}
          </span>

          <span class="badge trusted">
            ${escapeHtml(release.trustedSource)}
          </span>

          <a
            class="spotify-link"
            href="${spotifyUrl}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ▶ Open in Spotify
          </a>

        </div>
      `;


      results.appendChild(
        div
      );
    }
  );
}


/* -------------------------
   SAFETY
------------------------- */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text || "";

  return div.innerHTML;
}


/* -------------------------
   DISCONNECT
------------------------- */

function logout() {

  localStorage.removeItem(
    "spotify_access_token"
  );

  localStorage.removeItem(
    "code_verifier"
  );

  location.reload();
}


/* START */

handleSpotifyCallback();

</script>

</body>
</html>
