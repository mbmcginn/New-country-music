<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Country Music Finder</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 720px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-top: 25px;
    }

    .subtitle {
      text-align: center;
      color: #b3b3b3;
      line-height: 1.4;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .filter-btn {
      flex: 1;
      padding: 12px;
      border-radius: 22px;
      border: 1px solid #555;
      background: #242424;
      color: white;
      font-weight: bold;
    }

    .filter-btn.active {
      background: #1DB954;
      color: black;
      border-color: #1DB954;
    }

    button.main,
    button.secondary {
      display: block;
      width: 100%;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
    }

    button.main {
      background: #1DB954;
      color: black;
      padding: 16px;
      font-size: 18px;
      margin: 20px 0;
    }

    button.secondary {
      background: #333;
      color: white;
      padding: 14px;
      font-size: 16px;
      margin-bottom: 14px;
    }

    .status {
      text-align: center;
      color: #b3b3b3;
      margin: 20px 0;
      line-height: 1.5;
    }

    .release {
      background: #242424;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .cover {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .release-info {
      flex: 1;
      min-width: 0;
    }

    .release-name {
      font-size: 17px;
      font-weight: bold;
    }

    .artist {
      color: #b3b3b3;
      margin-top: 4px;
    }

    .meta {
      color: #999;
      font-size: 13px;
      margin-top: 5px;
    }

    .badge {
      display: inline-block;
      background: #174f2a;
      color: #b7f7c9;
      border-radius: 12px;
      padding: 3px 8px;
      font-size: 11px;
      margin-top: 6px;
      margin-right: 5px;
    }

    .spotify-link {
      display: block;
      margin-top: 9px;
      color: #1DB954;
      text-decoration: none;
      font-weight: bold;
    }

    .debug {
      font-size: 12px;
      color: #777;
      margin-top: 8px;
    }

    .artist-box {
      background: #1f1f1f;
      border-radius: 12px;
      padding: 14px;
      margin-top: 18px;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      box-sizing: border-box;
      background: #181818;
      color: white;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎵 New Country Music Finder</h1>

  <p class="subtitle">
    Recent releases from artists you trust.
  </p>

  <button
    id="loginButton"
    class="main"
    onclick="loginWithSpotify()"
  >
    Connect Spotify
  </button>

  <div id="controls" style="display:none;">

    <div class="filters">

      <button
        id="todayButton"
        class="filter-btn active"
        onclick="setRange('today')"
      >
        Today
      </button>

      <button
        id="weekButton"
        class="filter-btn"
        onclick="setRange('week')"
      >
        Last 7 Days
      </button>

    </div>

    <button
      class="main"
      onclick="findNewMusic(false)"
    >
      Find New Music
    </button>

    <button
      class="secondary"
      onclick="findNewMusic(true)"
    >
      Force Refresh
    </button>

    <button
      class="secondary"
      onclick="toggleArtistEditor()"
    >
      Edit Trusted Artists
    </button>

    <div
      id="artistEditor"
      class="artist-box"
      style="display:none;"
    >

      <p>One artist per line:</p>

      <textarea id="artistList"></textarea>

      <button
        class="main"
        onclick="saveTrustedArtists()"
      >
        Save Trusted Artists
      </button>

    </div>

    <button
      class="secondary"
      onclick="logout()"
    >
      Disconnect Spotify
    </button>

  </div>

  <div id="status" class="status">
    Connect Spotify to begin.
  </div>

  <div id="results"></div>

</div>

<script>

const clientId =
  "ec35e5f54f2946e18aa9086b4a89fd17";

const redirectUri =
  "https://mbmcginn.github.io/New-country-music/";

const CACHE_HOURS = 24;

const TAG_NEW_PAGES = 5;

const DIRECT_ARTISTS_PER_RUN = 8;

let selectedRange = "today";


const defaultTrustedArtists = [

  "Silverada",
  "Red Shahan",
  "Turnpike Troubadours",
  "Shane Smith & the Saints",
  "Cody Jinks",
  "Tyler Childers",
  "Sturgill Simpson",
  "Jason Isbell",
  "Whiskey Myers",
  "Charles Wesley Godwin",
  "49 Winchester",
  "Flatland Cavalry",
  "Mike and the Moonpies",
  "American Aquarium",
  "Parker McCollum",
  "Kaitlin Butts",
  "Zach Bryan",
  "Ryan Bingham",
  "Reckless Kelly",
  "Micky and the Motorcars",
  "Treaty Oak Revival",
  "William Clark Green",
  "Josh Meloy",
  "Hayes Carll",
  "Corb Lund",
  "Colter Wall",
  "The Steel Woods",
  "Ward Davis",
  "Josh Abbott Band",
  "Randy Rogers Band"

];


/* -------------------------
   RANGE
------------------------- */

function setRange(range) {

  selectedRange = range;

  document
    .getElementById("todayButton")
    .classList.toggle(
      "active",
      range === "today"
    );

  document
    .getElementById("weekButton")
    .classList.toggle(
      "active",
      range === "week"
    );

  showCachedResults();
}


/* -------------------------
   TRUSTED ARTISTS
------------------------- */

function getTrustedArtists() {

  const saved =
    localStorage.getItem(
      "trusted_artists"
    );

  if (!saved) {
    return defaultTrustedArtists;
  }

  try {

    const parsed =
      JSON.parse(saved);

    if (
      Array.isArray(parsed) &&
      parsed.length > 0
    ) {
      return parsed;
    }

  } catch (e) {}

  return defaultTrustedArtists;
}


function toggleArtistEditor() {

  const editor =
    document.getElementById(
      "artistEditor"
    );

  editor.style.display =
    editor.style.display === "none"
      ? "block"
      : "none";

  document.getElementById(
    "artistList"
  ).value =
    getTrustedArtists().join("\n");
}


function saveTrustedArtists() {

  const artists =
    document
      .getElementById("artistList")
      .value
      .split("\n")
      .map(x => x.trim())
      .filter(Boolean);

  localStorage.setItem(
    "trusted_artists",
    JSON.stringify(artists)
  );

  document.getElementById(
    "artistEditor"
  ).style.display =
    "none";

  document.getElementById(
    "status"
  ).innerText =
    "Trusted artist list saved.";
}


/* -------------------------
   LOGIN
------------------------- */

function randomString(length) {

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for (let i = 0; i < length; i++) {

    result += chars.charAt(
      Math.floor(
        Math.random() * chars.length
      )
    );
  }

  return result;
}


async function sha256(text) {

  return crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(text)
  );
}


function base64url(buffer) {

  return btoa(
    String.fromCharCode(
      ...new Uint8Array(buffer)
    )
  )
  .replace(/=/g, "")
  .replace(/\+/g, "-")
  .replace(/\//g, "_");
}


async function loginWithSpotify() {

  const verifier =
    randomString(64);

  localStorage.setItem(
    "code_verifier",
    verifier
  );

  const challenge =
    base64url(
      await sha256(verifier)
    );

  const url =
    new URL(
      "https://accounts.spotify.com/authorize"
    );

  url.search =
    new URLSearchParams({

      client_id: clientId,

      response_type: "code",

      redirect_uri: redirectUri,

      code_challenge_method: "S256",

      code_challenge: challenge

    }).toString();

  location.href =
    url.toString();
}


/* -------------------------
   TOKEN
------------------------- */

async function getToken(code) {

  const verifier =
    localStorage.getItem(
      "code_verifier"
    );

  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body:
          new URLSearchParams({

            client_id: clientId,

            grant_type:
              "authorization_code",

            code: code,

            redirect_uri:
              redirectUri,

            code_verifier:
              verifier

          })
      }
    );

  const data =
    await response.json();

  if (data.access_token) {

    localStorage.setItem(
      "spotify_access_token",
      data.access_token
    );
  }

  return data;
}


/* -------------------------
   CALLBACK
------------------------- */

async function handleCallback() {

  const params =
    new URLSearchParams(
      location.search
    );

  const code =
    params.get("code");

  if (code) {

    document.getElementById(
      "status"
    ).innerText =
      "Connecting to Spotify...";

    const token =
      await getToken(code);

    history.replaceState(
      {},
      document.title,
      redirectUri
    );

    if (token.access_token) {

      showConnected();

    } else {

      document.getElementById(
        "status"
      ).innerText =
        "Spotify connection failed.";
    }

  } else {

    if (
      localStorage.getItem(
        "spotify_access_token"
      )
    ) {

      showConnected();
    }
  }
}


function showConnected() {

  document.getElementById(
    "loginButton"
  ).style.display =
    "none";

  document.getElementById(
    "controls"
  ).style.display =
    "block";

  document.getElementById(
    "status"
  ).innerText =
    "Spotify connected.";

  showCachedResults();
}


/* -------------------------
   FETCH
------------------------- */

async function spotifyFetch(
  url,
  token
) {

  const response =
    await fetch(
      url,
      {
        headers: {
          Authorization:
            "Bearer " + token
        }
      }
    );

  if (response.status === 401) {
    throw new Error(
      "SESSION_EXPIRED"
    );
  }

  if (response.status === 429) {

    let body = {};

    try {
      body =
        await response.json();
    } catch (e) {}

    if (
      body?.reason ===
        "QUOTA_EXCEEDED" ||
      body?.error?.reason ===
        "QUOTA_EXCEEDED"
    ) {

      throw new Error(
        "QUOTA_EXCEEDED"
      );
    }

    throw new Error(
      "RATE_LIMIT"
    );
  }

  if (!response.ok) {

    throw new Error(
      "SPOTIFY_ERROR"
    );
  }

  return response.json();
}


/* -------------------------
   CACHE
------------------------- */

function getCache() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "hybrid_release_cache"
      )
    ) || {
      tagNew: null,
      direct: {},
      rotation: 0
    };

  } catch (e) {

    return {
      tagNew: null,
      direct: {},
      rotation: 0
    };
  }
}


function saveCache(cache) {

  localStorage.setItem(
    "hybrid_release_cache",
    JSON.stringify(cache)
  );
}


function cacheFresh(timestamp) {

  if (!timestamp) {
    return false;
  }

  return (
    Date.now() - timestamp
  ) <
  CACHE_HOURS *
  60 *
  60 *
  1000;
}


/* -------------------------
   TAG:NEW SEARCH
------------------------- */

async function getTagNewAlbums(
  token
) {

  let albums = [];

  for (
    let page = 0;
    page < TAG_NEW_PAGES;
    page++
  ) {

    const offset =
      page * 10;

    const data =
      await spotifyFetch(

        "https://api.spotify.com/v1/search?" +

        new URLSearchParams({

          q:
            "tag:new",

          type:
            "album",

          market:
            "US",

          limit:
            "10",

          offset:
            offset.toString()

        }),

        token
      );

    albums.push(
      ...(data.albums?.items || [])
    );

    if (
      (data.albums?.items || [])
        .length < 10
    ) {
      break;
    }
  }

  return albums;
}


/* -------------------------
   TRUSTED MATCH
------------------------- */

function normalize(text) {

  return (
    text || ""
  )
  .toLowerCase()
  .replace(/[^a-z0-9]/g, "");
}


function albumMatchesTrustedArtist(
  album,
  trustedArtists
) {

  const trusted =
    trustedArtists.map(
      normalize
    );

  return (
    album.artists || []
  ).some(
    artist =>
      trusted.includes(
        normalize(
          artist.name
        )
      )
  );
}


/* -------------------------
   ARTIST LOOKUP
------------------------- */

async function findArtist(
  name,
  token
) {

  const data =
    await spotifyFetch(

      "https://api.spotify.com/v1/search?" +

      new URLSearchParams({

        q:
          `artist:"${name}"`,

        type:
          "artist",

        limit:
          "5"

      }),

      token
    );

  const items =
    data.artists?.items || [];

  return (
    items.find(
      artist =>
        normalize(
          artist.name
        ) ===
        normalize(name)
    ) || null
  );
}


/* -------------------------
   DIRECT ARTIST RELEASES
------------------------- */

async function getArtistReleases(
  artist,
  token
) {

  const data =
    await spotifyFetch(

      "https://api.spotify.com/v1/artists/" +
      artist.id +
      "/albums?" +

      new URLSearchParams({

        include_groups:
          "album,single",

        market:
          "US",

        limit:
          "10"

      }),

      token
    );

  return (
    data.items || []
  ).map(
    release => ({
      ...release,
      source:
        "Direct artist check"
    })
  );
}


/* -------------------------
   DATE FILTER
------------------------- */

function isRecent(
  release
) {

  if (
    !release.release_date ||
    release.release_date_precision !==
      "day"
  ) {
    return false;
  }

  const now =
    new Date();

  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const cutoff =
    new Date(today);

  if (
    selectedRange ===
    "week"
  ) {

    cutoff.setDate(
      cutoff.getDate() - 6
    );
  }

  const date =
    new Date(
      release.release_date +
      "T00:00:00"
    );

  return (
    date >= cutoff &&
    date <= now
  );
}


/* -------------------------
   MAIN
------------------------- */

async function findNewMusic(
  forceRefresh
) {

  const token =
    localStorage.getItem(
      "spotify_access_token"
    );

  if (!token) {

    loginWithSpotify();
    return;
  }

  const status =
    document.getElementById(
      "status"
    );

  const trustedArtists =
    getTrustedArtists();

  const cache =
    getCache();

  try {

    /*
      TAG:NEW CACHE
    */

    if (
      forceRefresh ||
      !cache.tagNew ||
      !cacheFresh(
        cache.tagNew.checkedAt
      )
    ) {

      status.innerText =
        "Checking Spotify's new releases...";

      const tagNewAlbums =
        await getTagNewAlbums(
          token
        );

      cache.tagNew = {
        checkedAt:
          Date.now(),
        releases:
          tagNewAlbums
      };

      saveCache(
        cache
      );
    }


    /*
      ROTATING DIRECT CHECK
    */

    const start =
      cache.rotation || 0;

    const batch = [];

    for (
      let i = 0;
      i < DIRECT_ARTISTS_PER_RUN;
      i++
    ) {

      const index =
        (
          start + i
        ) %
        trustedArtists.length;

      batch.push(
        trustedArtists[index]
      );
    }


    for (
      let i = 0;
      i < batch.length;
      i++
    ) {

      const name =
        batch[i];

      const existing =
        cache.direct[name];

      if (
        !forceRefresh &&
        existing &&
        cacheFresh(
          existing.checkedAt
        )
      ) {
        continue;
      }

      status.innerText =
        "Checking trusted artists...\n" +
        name;

      const artist =
        await findArtist(
          name,
          token
        );

      if (!artist) {

        cache.direct[name] = {
          checkedAt:
            Date.now(),
          releases:
            []
        };

        continue;
      }

      const releases =
        await getArtistReleases(
          artist,
          token
        );

      cache.direct[name] = {
        checkedAt:
          Date.now(),
        releases:
          releases
      };

      saveCache(
        cache
      );

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            500
          )
      );
    }


    cache.rotation =
      (
        start +
        DIRECT_ARTISTS_PER_RUN
      ) %
      trustedArtists.length;

    saveCache(
      cache
    );

    showCachedResults();

  } catch (error) {

    if (
      error.message ===
      "QUOTA_EXCEEDED"
    ) {

      status.innerHTML =
        "<b>Spotify quota reached.</b><br><br>" +
        "Showing anything already cached.";

      showCachedResults();
      return;
    }

    if (
      error.message ===
      "RATE_LIMIT"
    ) {

      status.innerHTML =
        "Spotify asked us to slow down.<br><br>" +
        "Showing cached results.";

      showCachedResults();
      return;
    }

    if (
      error.message ===
      "SESSION_EXPIRED"
    ) {

      localStorage.removeItem(
        "spotify_access_token"
      );

      status.innerText =
        "Spotify session expired. Reconnect Spotify.";

      return;
    }

    status.innerText =
      "Something went wrong while checking Spotify.";
  }
}


/* -------------------------
   DISPLAY CACHE
------------------------- */

function showCachedResults() {

  const cache =
    getCache();

  const trustedArtists =
    getTrustedArtists();

  let releases = [];


  /*
    TAG:NEW TRUSTED MATCHES
  */

  if (
    cache.tagNew &&
    Array.isArray(
      cache.tagNew.releases
    )
  ) {

    const matched =
      cache.tagNew.releases
        .filter(
          album =>
            albumMatchesTrustedArtist(
              album,
              trustedArtists
            )
        )
        .map(
          album => ({
            ...album,
            source:
              "Spotify new releases"
          })
        );

    releases.push(
      ...matched
    );
  }


  /*
    DIRECT ARTIST CACHE
  */

  Object.values(
    cache.direct || {}
  ).forEach(
    entry => {

      if (
        Array.isArray(
          entry.releases
        )
      ) {

        releases.push(
          ...entry.releases
        );
      }
    }
  );


  /*
    DEDUPE
  */

  const unique =
    Array.from(
      new Map(
        releases
          .filter(
            release =>
              release?.id
          )
          .map(
            release => [
              release.id,
              release
            ]
          )
      ).values()
    );


  const recent =
    unique
      .filter(
        isRecent
      )
      .sort(
        (a, b) =>
          b.release_date
            .localeCompare(
              a.release_date
            )
      );


  displayReleases(
    recent,
    cache
  );
}


/* -------------------------
   DISPLAY
------------------------- */

function displayReleases(
  releases,
  cache
) {

  const results =
    document.getElementById(
      "results"
    );

  const status =
    document.getElementById(
      "status"
    );

  results.innerHTML =
    "";


  if (
    releases.length === 0
  ) {

    status.innerHTML =

      selectedRange ===
      "today"

      ? "No trusted releases found today."

      : "No trusted releases found in the last 7 days.";


    status.innerHTML +=
      `<div class="debug">
        New-release cache:
        ${cache.tagNew ? "yes" : "no"}.
        Direct artists cached:
        ${Object.keys(cache.direct || {}).length}.
      </div>`;

    return;
  }


  status.innerHTML =
    `<b>${releases.length} trusted new releases found</b>

    <div class="debug">
      Direct artists cached:
      ${Object.keys(cache.direct || {}).length}
    </div>`;


  releases.forEach(
    release => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "release";


      const artists =
        (release.artists || [])
          .map(
            artist =>
              artist.name
          )
          .join(", ");


      const image =
        release.images?.[1]?.url ||
        release.images?.[0]?.url ||
        "";


      const type =
        release.album_type ===
        "album"
          ? "Album"
          : "Single / EP";


      div.innerHTML = `

        ${
          image
            ? `<img
                class="cover"
                src="${image}"
                alt="Album artwork"
              >`
            : ""
        }

        <div class="release-info">

          <div class="release-name">
            ${escapeHtml(
              release.name
            )}
          </div>

          <div class="artist">
            ${escapeHtml(
              artists
            )}
          </div>

          <div class="meta">
            Released:
            ${release.release_date}
            • ${type}
          </div>

          <span class="badge">
            ${escapeHtml(
              release.source ||
              "Trusted"
            )}
          </span>

          <a
            class="spotify-link"
            href="${release.external_urls.spotify}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ▶ Open in Spotify
          </a>

        </div>
      `;

      results.appendChild(
        div
      );
    }
  );
}


/* -------------------------
   SAFETY
------------------------- */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text || "";

  return div.innerHTML;
}


/* -------------------------
   LOGOUT
------------------------- */

function logout() {

  localStorage.removeItem(
    "spotify_access_token"
  );

  localStorage.removeItem(
    "code_verifier"
  );

  location.reload();
}


/* START */

handleCallback();

</script>

</body>
</html>
