<script>

const clientId = "ec35e5f54f2946e18aa9086b4a89fd17";
const redirectUri = "https://mbmcginn.github.io/New-country-music/";

const CACHE_HOURS = 24;
const ARTISTS_PER_RUN = 8;

let selectedRange = "week";

const defaultTrustedArtists = [
  "Mountain Grass Unit",
  "Alabama Shakes",
  "Silverada",
  "Red Shahan",
  "Turnpike Troubadours",
  "Shane Smith & the Saints",

  "Treaty Oak Revival",
  "William Clark Green",
  "Josh Meloy",

  "Colter Wall",

  "Randy Rogers Band"

/* ---------- RANGE ---------- */

function setRange(range) {
  selectedRange = range;

  document.getElementById("todayButton")
    .classList.toggle("active", range === "today");

  document.getElementById("weekButton")
    .classList.toggle("active", range === "week");

  document.getElementById("monthButton")
    .classList.toggle("active", range === "month");

  displayCachedResults();
}


/* ---------- ARTISTS ---------- */

function normalize(text) {
  return (text || "")
    .toLowerCase()
    .replace(/[^a-z0-9]/g, "");
}

function getTrustedArtists() {
  try {
    const saved = JSON.parse(
      localStorage.getItem("trusted_artists")
    );

    if (Array.isArray(saved) && saved.length) return saved;
  } catch(e) {}

  return defaultTrustedArtists;
}

function toggleArtistEditor() {
  const box = document.getElementById("artistEditor");

  box.style.display =
    box.style.display === "none" ? "block" : "none";

  document.getElementById("artistList").value =
    getTrustedArtists().join("\n");
}

function saveTrustedArtists() {
  const oldArtists = getTrustedArtists();

  const newArtists =
    document.getElementById("artistList")
      .value
      .split("\n")
      .map(x => x.trim())
      .filter(Boolean);

  localStorage.setItem(
    "trusted_artists",
    JSON.stringify(newArtists)
  );

  const oldSet = new Set(oldArtists.map(normalize));

  const added =
    newArtists.filter(x => !oldSet.has(normalize(x)));

  if (added.length) {
    localStorage.setItem(
      "priority_artist_queue",
      JSON.stringify(added)
    );
  }

  document.getElementById("artistEditor").style.display = "none";

  document.getElementById("status").innerText =
    added.length
      ? `${added.length} new artist(s) prioritized.`
      : "Trusted artist list saved.";
}


/* ---------- PKCE ---------- */

function randomString(length) {
  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for (let i=0; i<length; i++) {
    result += chars.charAt(
      Math.floor(Math.random() * chars.length)
    );
  }

  return result;
}

async function sha256(text) {
  return crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(text)
  );
}

function base64url(buffer) {
  return btoa(
    String.fromCharCode(...new Uint8Array(buffer))
  )
  .replace(/=/g,"")
  .replace(/\+/g,"-")
  .replace(/\//g,"_");
}

async function loginWithSpotify() {
  const verifier = randomString(64);

  localStorage.setItem("code_verifier", verifier);

  const challenge = base64url(await sha256(verifier));
  const state = randomString(24);

  localStorage.setItem("spotify_auth_state", state);

  const url =
    new URL("https://accounts.spotify.com/authorize");

  url.search = new URLSearchParams({
    client_id: clientId,
    response_type: "code",
    redirect_uri: redirectUri,

    scope:
      "playlist-modify-private playlist-read-private",

    code_challenge_method: "S256",
    code_challenge: challenge,
    state: state
  }).toString();

  location.href = url.toString();
}


/* ---------- TOKENS ---------- */

function saveTokenData(data) {
  if (data.access_token) {
    localStorage.setItem(
      "spotify_access_token",
      data.access_token
    );

    localStorage.setItem(
      "spotify_token_expires",
      String(
        Date.now() +
        ((data.expires_in || 3600) - 60) * 1000
      )
    );
  }

  if (data.refresh_token) {
    localStorage.setItem(
      "spotify_refresh_token",
      data.refresh_token
    );
  }
}

async function exchangeCode(code) {
  const verifier =
    localStorage.getItem("code_verifier");

  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/x-www-form-urlencoded"
        },
        body:new URLSearchParams({
          client_id:clientId,
          grant_type:"authorization_code",
          code:code,
          redirect_uri:redirectUri,
          code_verifier:verifier
        })
      }
    );

  const data = await response.json();
  saveTokenData(data);
  return data;
}

async function refreshAccessToken() {
  const refreshToken =
    localStorage.getItem("spotify_refresh_token");

  if (!refreshToken) return null;

  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/x-www-form-urlencoded"
        },
        body:new URLSearchParams({
          grant_type:"refresh_token",
          refresh_token:refreshToken,
          client_id:clientId
        })
      }
    );

  if (!response.ok) return null;

  const data = await response.json();
  saveTokenData(data);

  return data.access_token || null;
}

async function getValidToken() {
  const token =
    localStorage.getItem("spotify_access_token");

  const expires =
    Number(
      localStorage.getItem("spotify_token_expires") || 0
    );

  if (token && Date.now() < expires) return token;

  return await refreshAccessToken();
}


/* ---------- CALLBACK ---------- */

async function handleCallback() {
  const params =
    new URLSearchParams(location.search);

  const code = params.get("code");

  if (code) {
    const returnedState = params.get("state");
    const expectedState =
      localStorage.getItem("spotify_auth_state");

    if (returnedState !== expectedState) {
      document.getElementById("status").innerText =
        "Spotify login validation failed.";
      return;
    }

    document.getElementById("status").innerText =
      "Connecting to Spotify...";

    const data = await exchangeCode(code);

    history.replaceState({}, document.title, redirectUri);

    localStorage.removeItem("spotify_auth_state");

    if (data.access_token) {
      showConnected();
    }

  } else {
    const token = await getValidToken();

    if (token) showConnected();
  }
}

function showConnected() {
  document.getElementById("loginButton").style.display = "none";
  document.getElementById("controls").style.display = "block";

  document.getElementById("status").innerText =
    "Spotify connected.";

  displayCachedResults();
}


/* ---------- API ---------- */

async function spotifyFetch(url, options = {}) {
  let token = await getValidToken();

  if (!token) throw new Error("SESSION_EXPIRED");

  const makeRequest = t => fetch(url, {
    ...options,
    headers:{
      ...(options.headers || {}),
      Authorization:"Bearer " + t
    }
  });

  let response = await makeRequest(token);

  if (response.status === 401) {
    token = await refreshAccessToken();

    if (!token) throw new Error("SESSION_EXPIRED");

    response = await makeRequest(token);
  }

  if (response.status === 429) {
    throw new Error("RATE_LIMIT");
  }

  if (!response.ok) {
    const body = await response.text();
    console.error(response.status, body);
    throw new Error("SPOTIFY_ERROR_" + response.status);
  }

  if (response.status === 204) return {};

  return response.json();
}


/* ---------- RELEASE CACHE ---------- */

function getCache() {
  try {
    return JSON.parse(
      localStorage.getItem("artist_release_cache_v2")
    ) || {artists:{},rotation:0};
  } catch(e) {
    return {artists:{},rotation:0};
  }
}

function saveCache(cache) {
  localStorage.setItem(
    "artist_release_cache_v2",
    JSON.stringify(cache)
  );
}

function isFresh(entry) {
  if (!entry?.checkedAt) return false;

  return Date.now() - entry.checkedAt <
    CACHE_HOURS * 60 * 60 * 1000;
}


/* ---------- ARTIST LOOKUP ---------- */

async function findArtistByName(name) {
  const data =
    await spotifyFetch(
      "https://api.spotify.com/v1/search?" +
      new URLSearchParams({
        q:`artist:"${name}"`,
        type:"artist",
        market:"US",
        limit:"5"
      })
    );

  return (data.artists?.items || [])
    .find(
      x => normalize(x.name) === normalize(name)
    ) || null;
}

async function getArtistReleases(artistId) {
  const data =
    await spotifyFetch(
      "https://api.spotify.com/v1/artists/" +
      artistId +
      "/albums?" +
      new URLSearchParams({
        include_groups:"album,single",
        market:"US",
        limit:"10",
        offset:"0"
      })
    );

  return data.items || [];
}


/* ---------- DATE ---------- */

function getRangeDates() {
  const now = new Date();

  const end =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const start = new Date(end);

  if (selectedRange === "week")
    start.setDate(start.getDate() - 6);

  if (selectedRange === "month")
    start.setDate(start.getDate() - 29);

  return {start,end};
}

function passesDateFilter(release) {
  if (
    !release.release_date ||
    release.release_date_precision !== "day"
  ) return false;

  const {start,end} = getRangeDates();

  const date =
    new Date(release.release_date + "T00:00:00");

  return date >= start && date <= end;
}


/* ---------- CHECK QUEUE ---------- */

function getArtistsToCheck(trusted, cache) {
  let priority = [];

  try {
    priority =
      JSON.parse(
        localStorage.getItem("priority_artist_queue")
      ) || [];
  } catch(e) {}

  const prioritySet =
    new Set(priority.map(normalize));

  const stale =
    trusted.filter(name =>
      !prioritySet.has(normalize(name)) &&
      !isFresh(cache.artists[normalize(name)])
    );

  let queue = [...priority,...stale];

  if (!queue.length) {
    const start = cache.rotation || 0;

    for (let i=0; i<ARTISTS_PER_RUN; i++) {
      queue.push(
        trusted[(start+i) % trusted.length]
      );
    }
  }

  return Array.from(
    new Map(
      queue.map(x => [normalize(x),x])
    ).values()
  ).slice(0,ARTISTS_PER_RUN);
}


/* ---------- FIND MUSIC ---------- */

async function findNewMusic() {
  const status =
    document.getElementById("status");

  const trusted = getTrustedArtists();
  const cache = getCache();

  const queue =
    getArtistsToCheck(trusted,cache);

  try {
    for (let i=0; i<queue.length; i++) {
      const name = queue[i];
      const key = normalize(name);

      let entry = cache.artists[key] || {};

      status.innerText =
        `Checking ${i+1} of ${queue.length}: ${name}`;

      let artistId = entry.artistId;

      if (!artistId) {
        const artist =
          await findArtistByName(name);

        if (!artist) continue;

        artistId = artist.id;
      }

      const releases =
        await getArtistReleases(artistId);

      cache.artists[key] = {
        artistName:name,
        artistId,
        checkedAt:Date.now(),
        releases
      };

      saveCache(cache);

      await new Promise(r => setTimeout(r,600));
    }

    cache.rotation =
      ((cache.rotation || 0) + ARTISTS_PER_RUN)
      % trusted.length;

    saveCache(cache);

    localStorage.setItem(
      "priority_artist_queue",
      "[]"
    );

    displayCachedResults();

  } catch(error) {
    console.error(error);

    status.innerText =
      error.message === "RATE_LIMIT"
        ? "Spotify asked us to slow down. Showing cached results."
        : "Spotify request failed. Showing cached results.";

    displayCachedResults();
  }
}


/* ---------- CURRENT RELEASES ---------- */

function getFilteredCachedReleases() {
  const cache = getCache();

  let releases = [];

  Object.values(cache.artists || {}).forEach(entry => {
    releases.push(...(entry.releases || []));
  });

  return Array.from(
    new Map(
      releases
        .filter(x => x?.id)
        .map(x => [x.id,x])
    ).values()
  )
  .filter(passesDateFilter)
  .sort(
    (a,b) =>
      b.release_date.localeCompare(a.release_date)
  );
}


/* ---------- DISPLAY ---------- */

function displayCachedResults() {
  const releases =
    getFilteredCachedReleases();

  const results =
    document.getElementById("results");

  const status =
    document.getElementById("status");

  results.innerHTML = "";

  if (!releases.length) {
    status.innerText =
      "No trusted releases found for this date range.";
    return;
  }

  status.innerHTML =
    `<b>${releases.length} new releases found</b>`;

  releases.forEach(release => {
    const div = document.createElement("div");
    div.className = "release";

    const artists =
      (release.artists || [])
        .map(x => x.name)
        .join(", ");

    const image =
      release.images?.[1]?.url ||
      release.images?.[0]?.url ||
      "";

    const type =
      release.album_type === "album"
        ? "Album / EP"
        : "Single";

    div.innerHTML = `
      ${image ?
        `<img class="cover" src="${image}" alt="Spotify artwork">`
        : ""}

      <div class="release-info">

        <div class="release-name">
          ${escapeHtml(release.name)}
        </div>

        <div class="artist">
          ${escapeHtml(artists)}
        </div>

        <div class="meta">
          ${escapeHtml(release.release_date)}
          • ${type}
        </div>

        <a class="spotify-link"
           href="${release.external_urls?.spotify || "#"}"
           target="_blank">
           ▶ Open in Spotify
        </a>

      </div>
    `;

    results.appendChild(div);
  });
}


/* ==================================================
   PLAYLIST SYSTEM
================================================== */


/* ---------- RELEASE TRACKS ---------- */

async function getReleaseTrackUris(release) {
  const cacheKey =
    "release_tracks_" + release.id;

  try {
    const cached =
      JSON.parse(localStorage.getItem(cacheKey));

    if (cached?.uris?.length) return cached.uris;
  } catch(e) {}

  let uris = [];
  let offset = 0;

  while (true) {
    const data =
      await spotifyFetch(
        "https://api.spotify.com/v1/albums/" +
        release.id +
        "/tracks?" +
        new URLSearchParams({
          market:"US",
          limit:"50",
          offset:String(offset)
        })
      );

    const items = data.items || [];

    uris.push(
      ...items
        .map(x => x.uri)
        .filter(Boolean)
    );

    if (!data.next || !items.length) break;

    offset += items.length;
  }

  localStorage.setItem(
    cacheKey,
    JSON.stringify({
      savedAt:Date.now(),
      uris
    })
  );

  return uris;
}


/* ---------- PLAYLIST NAMES ---------- */

function formatDate(date) {
  return date.toLocaleDateString(
    "en-US",
    {
      month:"short",
      day:"numeric",
      year:"numeric"
    }
  );
}

function getPlaylistNames() {
  const {start,end} = getRangeDates();

  let dateLabel;

  if (selectedRange === "today") {
    dateLabel = formatDate(end);
  } else {
    dateLabel =
      `${formatDate(start)} – ${formatDate(end)}`;
  }

  const year = end.getFullYear();

  return {
    datedAlbums:
      `New Albums — ${dateLabel}`,

    datedSingles:
      `New Singles — ${dateLabel}`,

    yearlyAlbums:
      `New Albums — ${year}`,

    yearlySingles:
      `New Singles — ${year}`
  };
}


/* ---------- PLAYLIST ID STORAGE ---------- */

function getPlaylistMap() {
  try {
    return JSON.parse(
      localStorage.getItem("playlist_id_map")
    ) || {};
  } catch(e) {
    return {};
  }
}

function savePlaylistMap(map) {
  localStorage.setItem(
    "playlist_id_map",
    JSON.stringify(map)
  );
}


/* ---------- FIND EXISTING PLAYLIST ---------- */

async function findPlaylistByName(name) {
  let offset = 0;

  while (true) {
    const data =
      await spotifyFetch(
        "https://api.spotify.com/v1/me/playlists?" +
        new URLSearchParams({
          limit:"50",
          offset:String(offset)
        })
      );

    const items = data.items || [];

    const match =
      items.find(x => x.name === name);

    if (match) return match;

    if (!data.next || !items.length) break;

    offset += items.length;
  }

  return null;
}


/* ---------- CREATE / GET PLAYLIST ---------- */

async function getOrCreatePlaylist(name) {
  const map = getPlaylistMap();

  if (map[name]) {
    return {
      id:map[name],
      name
    };
  }

  const existing =
    await findPlaylistByName(name);

  if (existing) {
    map[name] = existing.id;
    savePlaylistMap(map);
    return existing;
  }

  const playlist =
    await spotifyFetch(
      "https://api.spotify.com/v1/me/playlists",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          name,
          public:false,
          description:
            "Created by New Country Music Finder"
        })
      }
    );

  map[name] = playlist.id;
  savePlaylistMap(map);

  return playlist;
}


/* ---------- EXISTING PLAYLIST ITEMS ---------- */

async function getExistingPlaylistUris(playlistId) {
  const uris = new Set();

  let offset = 0;

  while (true) {
    const data =
      await spotifyFetch(
        "https://api.spotify.com/v1/playlists/" +
        playlistId +
        "/items?" +
        new URLSearchParams({
          limit:"50",
          offset:String(offset)
        })
      );

    const items = data.items || [];

    items.forEach(row => {
      const uri =
        row.item?.uri;

      if (uri) uris.add(uri);
    });

    if (!data.next || !items.length) break;

    offset += items.length;
  }

  return uris;
}


/* ---------- ADD UNIQUE ITEMS ---------- */

async function addUniqueTracks(playlist, uris) {
  if (!uris.length) return 0;

  const existing =
    await getExistingPlaylistUris(playlist.id);

  const unique =
    [...new Set(uris)]
      .filter(uri => !existing.has(uri));

  for (let i=0; i<unique.length; i+=100) {
    const batch = unique.slice(i,i+100);

    await spotifyFetch(
      "https://api.spotify.com/v1/playlists/" +
      playlist.id +
      "/items",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          uris:batch
        })
      }
    );
  }

  return unique.length;
}


/* ---------- CREATE PLAYLISTS ---------- */

async function createPlaylists() {
  const releases =
    getFilteredCachedReleases();

  const status =
    document.getElementById("playlistStatus");

  if (!releases.length) {
    status.innerHTML =
      `<div class="success-box">
       No releases are currently shown.
       Run Find New Music first.
       </div>`;
    return;
  }

  try {
    status.innerHTML =
      `<div class="success-box">
       Building playlists...
       </div>`;

    const albums =
      releases.filter(
        x => x.album_type === "album"
      );

    const singles =
      releases.filter(
        x => x.album_type === "single"
      );

    let albumUris = [];
    let singleUris = [];


    /* Get all album / EP tracks */

    for (let i=0; i<albums.length; i++) {
      status.innerHTML =
        `<div class="success-box">
         Getting album tracks ${i+1} of ${albums.length}...
         </div>`;

      albumUris.push(
        ...await getReleaseTrackUris(albums[i])
      );
    }


    /* Get single tracks */

    for (let i=0; i<singles.length; i++) {
      status.innerHTML =
        `<div class="success-box">
         Getting singles ${i+1} of ${singles.length}...
         </div>`;

      singleUris.push(
        ...await getReleaseTrackUris(singles[i])
      );
    }


    const names = getPlaylistNames();


    /* Only create a playlist if it has content */

    let datedAlbumPlaylist = null;
    let datedSinglePlaylist = null;
    let yearlyAlbumPlaylist = null;
    let yearlySinglePlaylist = null;


    if (albumUris.length) {
      datedAlbumPlaylist =
        await getOrCreatePlaylist(names.datedAlbums);

      yearlyAlbumPlaylist =
        await getOrCreatePlaylist(names.yearlyAlbums);
    }


    if (singleUris.length) {
      datedSinglePlaylist =
        await getOrCreatePlaylist(names.datedSingles);

      yearlySinglePlaylist =
        await getOrCreatePlaylist(names.yearlySingles);
    }


    let datedAlbumAdded = 0;
    let datedSingleAdded = 0;
    let yearlyAlbumAdded = 0;
    let yearlySingleAdded = 0;


    if (datedAlbumPlaylist) {
      datedAlbumAdded =
        await addUniqueTracks(
          datedAlbumPlaylist,
          albumUris
        );

      yearlyAlbumAdded =
        await addUniqueTracks(
          yearlyAlbumPlaylist,
          albumUris
        );
    }


    if (datedSinglePlaylist) {
      datedSingleAdded =
        await addUniqueTracks(
          datedSinglePlaylist,
          singleUris
        );

      yearlySingleAdded =
        await addUniqueTracks(
          yearlySinglePlaylist,
          singleUris
        );
    }


    status.innerHTML = `
      <div class="success-box">

        <b>✓ Playlists updated</b><br><br>

        ${datedAlbumPlaylist ?
          `💿 ${escapeHtml(names.datedAlbums)}
           — ${datedAlbumAdded} tracks added<br>`
          : ""}

        ${datedSinglePlaylist ?
          `🎵 ${escapeHtml(names.datedSingles)}
           — ${datedSingleAdded} tracks added<br>`
          : ""}

        <br>

        ${yearlyAlbumPlaylist ?
          `💿 ${escapeHtml(names.yearlyAlbums)}
           — ${yearlyAlbumAdded} new tracks<br>`
          : ""}

        ${yearlySinglePlaylist ?
          `🎵 ${escapeHtml(names.yearlySingles)}
           — ${yearlySingleAdded} new tracks`
          : ""}

      </div>
    `;

  } catch(error) {
    console.error(error);

    if (
      error.message === "SPOTIFY_ERROR_403"
    ) {
      status.innerHTML =
        `<div class="success-box">
         Spotify has not granted playlist permission yet.<br><br>
         Tap <b>Disconnect Spotify</b>, then reconnect and approve the new permissions.
         </div>`;
      return;
    }

    if (
      error.message === "RATE_LIMIT"
    ) {
      status.innerHTML =
        `<div class="success-box">
         Spotify asked us to slow down.
         Don't press the button repeatedly.
         </div>`;
      return;
    }

    status.innerHTML =
      `<div class="success-box">
       Something went wrong creating the playlists.
       </div>`;
  }
}


/* ---------- SAFETY ---------- */

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text || "";
  return div.innerHTML;
}


/* ---------- LOGOUT ---------- */

function clearTokens() {
  localStorage.removeItem("spotify_access_token");
  localStorage.removeItem("spotify_refresh_token");
  localStorage.removeItem("spotify_token_expires");
  localStorage.removeItem("code_verifier");
}

function logout() {
  clearTokens();
  location.reload();
}


/* START */

handleCallback();

</script>
