<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Country Music Finder</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-top: 25px;
    }

    .subtitle {
      text-align: center;
      color: #b3b3b3;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .filter-btn {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      border: 1px solid #555;
      background: #242424;
      color: white;
      font-weight: bold;
    }

    .filter-btn.active {
      background: #1DB954;
      color: black;
      border-color: #1DB954;
    }

    button.main {
      display: block;
      width: 100%;
      background: #1DB954;
      color: black;
      border: none;
      padding: 16px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      margin: 20px 0;
    }

    button.secondary {
      display: block;
      width: 100%;
      background: #333;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .status {
      text-align: center;
      color: #b3b3b3;
      margin: 20px 0;
      line-height: 1.5;
    }

    .album {
      background: #242424;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .cover {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .album-info {
      flex: 1;
      min-width: 0;
    }

    .album-name {
      font-size: 17px;
      font-weight: bold;
    }

    .artist {
      color: #b3b3b3;
      margin-top: 4px;
    }

    .release-date {
      color: #999;
      font-size: 13px;
      margin-top: 5px;
    }

    .spotify-link {
      display: inline-block;
      margin-top: 9px;
      color: #1DB954;
      text-decoration: none;
      font-weight: bold;
    }

    .debug {
      font-size: 13px;
      color: #888;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎵 New Country Music Finder</h1>

  <p class="subtitle">
    Find newly released country music on Spotify
  </p>

  <button
    id="loginButton"
    class="main"
    onclick="loginWithSpotify()"
  >
    Connect Spotify
  </button>

  <div id="controls" style="display:none;">

    <div class="filters">

      <button
        id="todayButton"
        class="filter-btn active"
        onclick="setRange('today')"
      >
        Today
      </button>

      <button
        id="weekButton"
        class="filter-btn"
        onclick="setRange('week')"
      >
        Last 7 Days
      </button>

    </div>

    <button
      class="main"
      onclick="findNewMusic()"
    >
      Find New Music
    </button>

    <button
      class="secondary"
      onclick="logout()"
    >
      Disconnect Spotify
    </button>

  </div>

  <div id="status" class="status">
    Connect Spotify to begin.
  </div>

  <div id="results"></div>

</div>


<script>

const clientId =
  "ec35e5f54f2946e18aa9086b4a89fd17";

const redirectUri =
  "https://mbmcginn.github.io/New-country-music/";

let selectedRange = "today";


/* DATE RANGE */

function setRange(range) {

  selectedRange = range;

  document
    .getElementById("todayButton")
    .classList.toggle("active", range === "today");

  document
    .getElementById("weekButton")
    .classList.toggle("active", range === "week");
}


/* PKCE LOGIN */

function generateRandomString(length) {

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for (let i = 0; i < length; i++) {
    result += chars.charAt(
      Math.floor(Math.random() * chars.length)
    );
  }

  return result;
}


async function sha256(plain) {

  const encoder = new TextEncoder();

  const data = encoder.encode(plain);

  return window.crypto.subtle.digest(
    "SHA-256",
    data
  );
}


function base64encode(input) {

  return btoa(
    String.fromCharCode(
      ...new Uint8Array(input)
    )
  )
  .replace(/=/g, "")
  .replace(/\+/g, "-")
  .replace(/\//g, "_");
}


async function loginWithSpotify() {

  const verifier =
    generateRandomString(64);

  localStorage.setItem(
    "code_verifier",
    verifier
  );

  const challenge =
    base64encode(
      await sha256(verifier)
    );

  const authUrl =
    new URL(
      "https://accounts.spotify.com/authorize"
    );

  authUrl.search =
    new URLSearchParams({

      client_id: clientId,

      response_type: "code",

      redirect_uri: redirectUri,

      code_challenge_method: "S256",

      code_challenge: challenge

    }).toString();

  window.location.href =
    authUrl.toString();
}


/* TOKEN */

async function getToken(code) {

  const verifier =
    localStorage.getItem(
      "code_verifier"
    );

  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body:
          new URLSearchParams({

            client_id: clientId,

            grant_type:
              "authorization_code",

            code: code,

            redirect_uri:
              redirectUri,

            code_verifier:
              verifier

          })
      }
    );

  const data =
    await response.json();

  if (data.access_token) {

    localStorage.setItem(
      "spotify_access_token",
      data.access_token
    );
  }

  return data;
}


/* CALLBACK */

async function handleSpotifyCallback() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const code =
    params.get("code");

  if (code) {

    document.getElementById(
      "status"
    ).innerText =
      "Connecting to Spotify...";

    const tokenData =
      await getToken(code);

    window.history.replaceState(
      {},
      document.title,
      redirectUri
    );

    if (tokenData.access_token) {

      showConnected();

    } else {

      document.getElementById(
        "status"
      ).innerText =
        "Spotify connection failed.";
    }

  } else {

    const token =
      localStorage.getItem(
        "spotify_access_token"
      );

    if (token) {
      showConnected();
    }
  }
}


function showConnected() {

  document.getElementById(
    "loginButton"
  ).style.display =
    "none";

  document.getElementById(
    "controls"
  ).style.display =
    "block";

  document.getElementById(
    "status"
  ).innerText =
    "Spotify connected.";
}


/* SEARCH */

async function searchAlbums(query, token) {

  let albums = [];

  for (
    let offset = 0;
    offset < 100;
    offset += 10
  ) {

    const url =
      "https://api.spotify.com/v1/search?" +
      new URLSearchParams({

        q: query,

        type: "album",

        market: "US",

        limit: "10",

        offset: offset.toString()

      });

    const response =
      await fetch(
        url,
        {
          headers: {
            Authorization:
              "Bearer " + token
          }
        }
      );

    if (response.status === 401) {
      throw new Error("SESSION_EXPIRED");
    }

    if (response.status === 429) {
      throw new Error("RATE_LIMIT");
    }

    if (!response.ok) {

      console.error(
        await response.text()
      );

      break;
    }

    const data =
      await response.json();

    const items =
      data.albums?.items || [];

    albums.push(...items);

    if (items.length < 10) {
      break;
    }
  }

  return albums;
}


/* FIND MUSIC */

async function findNewMusic() {

  const token =
    localStorage.getItem(
      "spotify_access_token"
    );

  if (!token) {

    loginWithSpotify();

    return;
  }

  const status =
    document.getElementById(
      "status"
    );

  const results =
    document.getElementById(
      "results"
    );

  results.innerHTML = "";

  status.innerText =
    "Searching Spotify for new releases...";


  /*
    Spotify allows tag:new for albums.
    We'll combine that with several
    country-related search terms.
  */

  const searches = [

    'tag:new country',

    'tag:new "country music"',

    'tag:new americana',

    'tag:new "red dirt"',

    'tag:new "country rock"',

    'tag:new "Texas country"',

    'tag:new "outlaw country"',

    'tag:new bluegrass'

  ];


  let allAlbums = [];


  try {

    for (
      let i = 0;
      i < searches.length;
      i++
    ) {

      status.innerText =
        "Searching Spotify... " +
        (i + 1) +
        " of " +
        searches.length;

      const found =
        await searchAlbums(
          searches[i],
          token
        );

      allAlbums.push(...found);
    }

  } catch (error) {

    if (
      error.message ===
      "SESSION_EXPIRED"
    ) {

      localStorage.removeItem(
        "spotify_access_token"
      );

      status.innerText =
        "Spotify session expired. Reconnect Spotify.";

      document.getElementById(
        "loginButton"
      ).style.display =
        "block";

      document.getElementById(
        "controls"
      ).style.display =
        "none";

      return;
    }


    if (
      error.message ===
      "RATE_LIMIT"
    ) {

      status.innerText =
        "Spotify temporarily rate-limited the search. Wait a minute and try again.";

      return;
    }


    status.innerText =
      "Spotify search failed.";

    return;
  }


  /* REMOVE DUPLICATES */

  const uniqueAlbums =
    Array.from(
      new Map(
        allAlbums
          .filter(album => album?.id)
          .map(
            album => [
              album.id,
              album
            ]
          )
      ).values()
    );


  /* DATE RANGE */

  const now =
    new Date();

  const todayStart =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );


  let cutoff =
    new Date(todayStart);


  if (
    selectedRange ===
    "week"
  ) {

    cutoff.setDate(
      cutoff.getDate() - 6
    );
  }


  /* FILTER RELEASE DATE */

  const recentAlbums =
    uniqueAlbums.filter(
      album => {

        if (
          !album.release_date ||
          album.release_date_precision !== "day"
        ) {

          return false;
        }


        const release =
          new Date(
            album.release_date +
            "T00:00:00"
          );


        return (
          release >= cutoff &&
          release <= now
        );
      }
    );


  /* SORT */

  recentAlbums.sort(
    (a, b) => {

      const dateCompare =
        b.release_date.localeCompare(
          a.release_date
        );

      if (dateCompare !== 0) {
        return dateCompare;
      }

      return (
        a.artists?.[0]?.name || ""
      ).localeCompare(
        b.artists?.[0]?.name || ""
      );
    }
  );


  displayAlbums(
    recentAlbums,
    allAlbums.length,
    uniqueAlbums.length
  );
}


/* DISPLAY */

function displayAlbums(
  albums,
  rawCount,
  uniqueCount
) {

  const results =
    document.getElementById(
      "results"
    );

  const status =
    document.getElementById(
      "status"
    );


  if (
    albums.length === 0
  ) {

    status.innerHTML =

      selectedRange === "today"

        ? "No qualifying releases from today were found."

        : "No qualifying releases from the last 7 days were found.";


    status.innerHTML +=

      `<div class="debug">
        Spotify returned ${rawCount} results,
        representing ${uniqueCount} unique albums.
      </div>`;

    return;
  }


  status.innerHTML =

    `${albums.length} new releases found

    <div class="debug">
      Spotify returned ${rawCount} search results,
      representing ${uniqueCount} unique albums.
    </div>`;


  albums.forEach(
    album => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "album";


      const artists =
        (album.artists || [])
          .map(
            artist =>
              artist.name
          )
          .join(", ");


      const image =
        album.images?.[1]?.url ||
        album.images?.[0]?.url ||
        "";


      const spotifyUrl =
        album.external_urls?.spotify ||
        "#";


      div.innerHTML = `

        ${
          image
          ?
          `<img
            class="cover"
            src="${image}"
            alt="Album artwork"
          >`
          :
          ""
        }

        <div class="album-info">

          <div class="album-name">
            ${escapeHtml(album.name)}
          </div>

          <div class="artist">
            ${escapeHtml(artists)}
          </div>

          <div class="release-date">
            Released:
            ${album.release_date}
          </div>

          <a
            class="spotify-link"
            href="${spotifyUrl}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ▶ Open in Spotify
          </a>

        </div>
      `;


      results.appendChild(
        div
      );
    }
  );
}


/* HTML SAFETY */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text || "";

  return div.innerHTML;
}


/* DISCONNECT */

function logout() {

  localStorage.removeItem(
    "spotify_access_token"
  );

  localStorage.removeItem(
    "code_verifier"
  );

  location.reload();
}


/* START */

handleSpotifyCallback();

</script>

</body>
</html>
