<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Country Music Finder</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: white;
      margin: 0;
      padding: 25px;
      text-align: center;
    }

    h1 {
      margin-top: 40px;
    }

    p {
      color: #b3b3b3;
    }

    button {
      background: #1DB954;
      color: black;
      border: none;
      padding: 16px 28px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
    }

    .status {
      margin-top: 30px;
      color: #b3b3b3;
    }
  </style>
</head>

<body>

  <h1>🎵 New Country Music Finder</h1>

  <p>Find newly released country music on Spotify.</p>

  <button onclick="findMusic()">
    Find New Music
  </button>

  <div class="status" id="status">
    Ready to search.
  </div>

  <script>
    function findMusic() {
      document.getElementById("status").innerHTML =
        "Spotify connection coming next...";
    }
  </script>

</body>
</html>
