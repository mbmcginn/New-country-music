<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Country Music Finder</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-top: 25px;
    }

    .subtitle {
      text-align: center;
      color: #b3b3b3;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .filter-btn {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      border: 1px solid #555;
      background: #242424;
      color: white;
      font-weight: bold;
    }

    .filter-btn.active {
      background: #1DB954;
      color: black;
      border-color: #1DB954;
    }

    button.main {
      display: block;
      width: 100%;
      background: #1DB954;
      color: black;
      border: none;
      padding: 16px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      margin: 20px 0;
      cursor: pointer;
    }

    button.secondary {
      display: block;
      width: 100%;
      background: #333;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .status {
      text-align: center;
      color: #b3b3b3;
      margin: 20px 0;
    }

    .track {
      background: #242424;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .cover {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }

    .track-name {
      font-size: 17px;
      font-weight: bold;
    }

    .artist {
      color: #b3b3b3;
      margin-top: 4px;
    }

    .release-date {
      color: #999;
      font-size: 13px;
      margin-top: 5px;
    }

    .spotify-link {
      display: inline-block;
      margin-top: 9px;
      color: #1DB954;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎵 New Country Music Finder</h1>

  <p class="subtitle">
    Find newly released country music on Spotify
  </p>

  <button
    id="loginButton"
    class="main"
    onclick="loginWithSpotify()"
  >
    Connect Spotify
  </button>

  <div
    id="controls"
    style="display:none;"
  >

    <div class="filters">
      <button
        id="todayButton"
        class="filter-btn active"
        onclick="setRange('today')"
      >
        Today
      </button>

      <button
        id="weekButton"
        class="filter-btn"
        onclick="setRange('week')"
      >
        Last 7 Days
      </button>
    </div>

    <button
      class="main"
      onclick="findNewMusic()"
    >
      Find New Music
    </button>

    <button
      class="secondary"
      onclick="logout()"
    >
      Disconnect Spotify
    </button>

  </div>

  <div id="status" class="status">
    Connect Spotify to begin.
  </div>

  <div id="results"></div>

</div>


<script>

const clientId =
  "ec35e5f54f2946e18aa9086b4a89fd17";

const redirectUri =
  "https://mbmcginn.github.io/New-country-music/";

let selectedRange = "today";


/* ----------------------------------------
   DATE RANGE BUTTONS
---------------------------------------- */

function setRange(range) {

  selectedRange = range;

  document
    .getElementById("todayButton")
    .classList.toggle(
      "active",
      range === "today"
    );

  document
    .getElementById("weekButton")
    .classList.toggle(
      "active",
      range === "week"
    );
}


/* ----------------------------------------
   PKCE LOGIN
---------------------------------------- */

function generateRandomString(length) {

  const possible =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let text = "";

  for (let i = 0; i < length; i++) {

    text += possible.charAt(
      Math.floor(Math.random() * possible.length)
    );
  }

  return text;
}


async function sha256(plain) {

  const encoder =
    new TextEncoder();

  const data =
    encoder.encode(plain);

  return window.crypto.subtle.digest(
    "SHA-256",
    data
  );
}


function base64encode(input) {

  return btoa(
    String.fromCharCode(
      ...new Uint8Array(input)
    )
  )
  .replace(/=/g, "")
  .replace(/\+/g, "-")
  .replace(/\//g, "_");
}


async function loginWithSpotify() {

  const codeVerifier =
    generateRandomString(64);

  localStorage.setItem(
    "code_verifier",
    codeVerifier
  );

  const hashed =
    await sha256(codeVerifier);

  const codeChallenge =
    base64encode(hashed);

  const authUrl =
    new URL(
      "https://accounts.spotify.com/authorize"
    );

  authUrl.search =
    new URLSearchParams({

      client_id: clientId,

      response_type: "code",

      redirect_uri: redirectUri,

      code_challenge_method: "S256",

      code_challenge: codeChallenge

    }).toString();

  window.location.href =
    authUrl.toString();
}


/* ----------------------------------------
   TOKEN
---------------------------------------- */

async function getToken(code) {

  const codeVerifier =
    localStorage.getItem(
      "code_verifier"
    );

  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body:
          new URLSearchParams({

            client_id: clientId,

            grant_type:
              "authorization_code",

            code: code,

            redirect_uri:
              redirectUri,

            code_verifier:
              codeVerifier

          })
      }
    );

  const data =
    await response.json();

  if (data.access_token) {

    localStorage.setItem(
      "spotify_access_token",
      data.access_token
    );
  }

  return data;
}


/* ----------------------------------------
   SPOTIFY CALLBACK
---------------------------------------- */

async function handleSpotifyCallback() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const code =
    params.get("code");

  if (code) {

    document.getElementById(
      "status"
    ).innerText =
      "Connecting to Spotify...";

    const tokenData =
      await getToken(code);

    window.history.replaceState(
      {},
      document.title,
      redirectUri
    );

    if (tokenData.access_token) {

      showConnected();

    } else {

      document.getElementById(
        "status"
      ).innerText =
        "Spotify connection failed.";
    }

  } else {

    const token =
      localStorage.getItem(
        "spotify_access_token"
      );

    if (token) {
      showConnected();
    }
  }
}


function showConnected() {

  document.getElementById(
    "loginButton"
  ).style.display = "none";

  document.getElementById(
    "controls"
  ).style.display = "block";

  document.getElementById(
    "status"
  ).innerText =
    "Spotify connected.";
}


/* ----------------------------------------
   SEARCH ONE QUERY WITH PAGINATION
---------------------------------------- */

async function searchSpotify(query, token) {

  let tracks = [];

  /*
    10 results per request.
    We check 10 pages = up to 100 results
    for each search query.
  */

  for (
    let offset = 0;
    offset < 100;
    offset += 10
  ) {

    const url =
      "https://api.spotify.com/v1/search?" +
      new URLSearchParams({

        q: query,

        type: "track",

        market: "US",

        limit: "10",

        offset:
          offset.toString()

      });

    const response =
      await fetch(
        url,
        {
          headers: {
            Authorization:
              "Bearer " + token
          }
        }
      );

    if (response.status === 401) {

      localStorage.removeItem(
        "spotify_access_token"
      );

      throw new Error(
        "SESSION_EXPIRED"
      );
    }

    if (response.status === 429) {

      throw new Error(
        "RATE_LIMIT"
      );
    }

    if (!response.ok) {

      console.error(
        "Spotify search error:",
        response.status,
        await response.text()
      );

      break;
    }

    const data =
      await response.json();

    const items =
      data.tracks?.items || [];

    tracks.push(...items);

    if (items.length < 10) {
      break;
    }
  }

  return tracks;
}


/* ----------------------------------------
   FIND NEW MUSIC
---------------------------------------- */

async function findNewMusic() {

  const token =
    localStorage.getItem(
      "spotify_access_token"
    );

  if (!token) {

    loginWithSpotify();

    return;
  }

  const status =
    document.getElementById(
      "status"
    );

  const results =
    document.getElementById(
      "results"
    );

  results.innerHTML = "";

  status.innerText =
    "Searching Spotify...";

  const now =
    new Date();

  const year =
    now.getFullYear();

  /*
    Search Spotify using supported
    field filters plus related terms.
  */

  const searches = [

    `genre:country year:${year}`,

    `country year:${year}`,

    `"country music" year:${year}`,

    `americana year:${year}`,

    `"red dirt" year:${year}`,

    `"country rock" year:${year}`,

    `"alt country" year:${year}`,

    `"Texas country" year:${year}`,

    `"outlaw country" year:${year}`

  ];

  let allTracks = [];

  try {

    for (
      let i = 0;
      i < searches.length;
      i++
    ) {

      status.innerText =
        "Searching Spotify... " +
        (i + 1) +
        " of " +
        searches.length;

      const tracks =
        await searchSpotify(
          searches[i],
          token
        );

      allTracks.push(
        ...tracks
      );
    }

  } catch (error) {

    if (
      error.message ===
      "SESSION_EXPIRED"
    ) {

      status.innerText =
        "Spotify session expired. Connect again.";

      document.getElementById(
        "loginButton"
      ).style.display =
        "block";

      document.getElementById(
        "controls"
      ).style.display =
        "none";

      return;
    }

    if (
      error.message ===
      "RATE_LIMIT"
    ) {

      status.innerText =
        "Spotify temporarily limited the searches. Wait a minute and try again.";

      return;
    }

    status.innerText =
      "Something went wrong while searching Spotify.";

    return;
  }


  /* Remove duplicate tracks */

  const uniqueTracks =
    Array.from(
      new Map(
        allTracks
          .filter(track => track?.id)
          .map(
            track => [
              track.id,
              track
            ]
          )
      ).values()
    );


  /* Establish date cutoff */

  const todayStart =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  let cutoffDate;

  if (
    selectedRange ===
    "today"
  ) {

    cutoffDate =
      todayStart;

  } else {

    cutoffDate =
      new Date(
        todayStart
      );

    cutoffDate.setDate(
      cutoffDate.getDate() - 6
    );
  }


  /* Filter exact release dates */

  const recentTracks =
    uniqueTracks.filter(
      track => {

        const album =
          track.album;

        if (
          !album ||
          !album.release_date
        ) {
          return false;
        }

        /*
          We only want dates with
          full day precision.
        */

        if (
          album.release_date_precision !==
          "day"
        ) {
          return false;
        }

        const releaseDate =
          new Date(
            album.release_date +
            "T00:00:00"
          );

        return (
          releaseDate >= cutoffDate &&
          releaseDate <= now
        );
      }
    );


  /* Sort newest first, then artist */

  recentTracks.sort(
    (a, b) => {

      const dateCompare =
        b.album.release_date.localeCompare(
          a.album.release_date
        );

      if (dateCompare !== 0) {
        return dateCompare;
      }

      return (
        a.artists?.[0]?.name || ""
      ).localeCompare(
        b.artists?.[0]?.name || ""
      );
    }
  );


  displayTracks(
    recentTracks
  );
}


/* ----------------------------------------
   DISPLAY RESULTS
---------------------------------------- */

function displayTracks(tracks) {

  const results =
    document.getElementById(
      "results"
    );

  const status =
    document.getElementById(
      "status"
    );

  if (
    tracks.length === 0
  ) {

    status.innerText =
      selectedRange === "today"
        ? "No tracks released today were found."
        : "No tracks released in the last 7 days were found.";

    return;
  }


  status.innerText =
    tracks.length +
    (
      tracks.length === 1
        ? " new track found"
        : " new tracks found"
    );


  tracks.forEach(
    track => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "track";


      const artists =
        (track.artists || [])
          .map(
            artist =>
              artist.name
          )
          .join(", ");


      const image =
        track.album?.images?.[1]?.url ||
        track.album?.images?.[0]?.url ||
        "";


      const spotifyUrl =
        track.external_urls?.spotify ||
        "#";


      div.innerHTML = `

        ${
          image
            ? `<img
                class="cover"
                src="${image}"
                alt="Album artwork"
              >`
            : ""
        }

        <div class="track-info">

          <div class="track-name">
            ${escapeHtml(track.name)}
          </div>

          <div class="artist">
            ${escapeHtml(artists)}
          </div>

          <div class="release-date">
            Released:
            ${track.album.release_date}
          </div>

          <a
            class="spotify-link"
            href="${spotifyUrl}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ▶ Open in Spotify
          </a>

        </div>
      `;

      results.appendChild(
        div
      );
    }
  );
}


/* ----------------------------------------
   BASIC HTML SAFETY
---------------------------------------- */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text || "";

  return div.innerHTML;
}


/* ----------------------------------------
   DISCONNECT
---------------------------------------- */

function logout() {

  localStorage.removeItem(
    "spotify_access_token"
  );

  localStorage.removeItem(
    "code_verifier"
  );

  location.reload();
}


/* START */

handleSpotifyCallback();

</script>

</body>
</html>
